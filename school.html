<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>The Fold · Essay — War and Peace</title>
<script src="fold-theme-boot.js"></script>
<style>
  :root { color-scheme: light; --bg:#fff; --side2:#f1f1f4; --line:#e4e4e9; --ink:#141416; --ink2:#44444e; --dim:#5f5f6b;
    --acc:#17171a; --ok:#16793a; --ok-soft:#e6f4ea; --bad:#c62828; --warn:#a04a07; --link:#1d4ed8; --ag:#0d7a70; --ag-soft:#e7f6f3;
    --r:10px; --mono:ui-monospace,Menlo,monospace; --sans:Inter,system-ui,sans-serif; }
  html[data-theme="dark"] { --bg:#101014; --side2:#17171b; --line:#26262c; --ink:#eceef2; --ink2:#b8bcc6; --dim:#8a8f9c; --ok:#3dd68c; --ok-soft:#0e2a1a; --bad:#ff5f5f; --warn:#ffb066; --link:#7aa2ff; --ag:#3dd6c4; --ag-soft:#0c2724; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 var(--sans); }
  .wrap { max-width:820px; margin:0 auto; padding:32px 22px 100px; }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.02em; } h1 b { color:var(--ag); }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .card { border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; margin-bottom:14px; }
  .badge { display:inline-block; font:600 11px/1 var(--mono); padding:5px 9px; border-radius:999px; margin-right:8px; }
  .ok { background:var(--ok-soft); color:var(--ok); } .bad { background:#fdeaea; color:var(--bad); }
  html[data-theme="dark"] .bad { background:#2a1010; }
  .label { color:var(--dim); font:600 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.08em; margin:14px 0 8px; }
  .mono { font:12.5px/1.75 var(--mono); } .btn { border:0; background:var(--acc); color:var(--bg); font:600 13px/1 var(--sans); padding:11px 18px; border-radius:999px; cursor:pointer; }
  .btn[disabled] { opacity:.5; cursor:default; } .btn.alt { background:var(--ag); }
  #log { white-space:pre-wrap; font:12px/1.8 var(--mono); color:var(--ink2); background:var(--side2); border-radius:var(--r); padding:12px 14px; max-height:170px; overflow:auto; }
  .topic { font-size:17px; font-weight:600; margin:4px 0 2px; }
  .essay { font:15px/1.75 var(--sans); } .essay p { margin:0 0 14px; }
  .essay q, .essay .q { color:var(--ag); } .pill { display:inline-block; font:11px var(--mono); color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:2px 8px; margin:2px 4px 2px 0; }
  #status { font:600 13px/1.4 var(--sans); }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Fold · <b>Essay</b></h1>
  <div class="sub">War and Peace, read by the full pipeline: khora reads · janus kinds · penelope's snip-cite grounds every quote. The mouth is <b>WebLLM, in this tab</b>.</div>

  <div class="card">
    <div class="label">topic</div>
    <div class="topic" id="topic">…</div>
    <div class="label">the box (what the mouth may draw on)</div>
    <div class="mono" id="box">loading…</div>
    <button class="btn" id="run" disabled style="margin-top:16px">Compose the essay (loads WebLLM in-browser)</button>
    <div class="label" style="margin-top:14px">log</div>
    <div id="log"></div>
  </div>

  <div class="card" id="essayCard" hidden>
    <div class="label">the essay — grounded, cited in text</div>
    <div id="status" style="margin-bottom:12px"></div>
    <div class="essay" id="essay"></div>
    <div class="label">verbatim snips (each at its byte address)</div>
    <div id="snips" class="mono"></div>
  </div>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
const log = (m) => { $("log").textContent += (($("log").textContent ? "\n" : "")) + m; $("log").scrollTop = $("log").scrollHeight; };
let BOX = null;

// 1. fetch the box (READ + BOX-SETTLE + HUNT — server side, no model)
try {
  BOX = await (await fetch("/api/essay/box")).json();
  if (BOX.error) { log("box error: " + BOX.error); throw new Error(BOX.error); }
  $("topic").textContent = BOX.topic;
  $("box").textContent = `cast: ${BOX.cast.join(", ")}\ndeed: ${BOX.deeds.join(", ")}\nkinds: ${BOX.kinds.map(k=>`[${k.members.join(",")}]`).join(" ")}\nhunt: ${BOX.hunt.length} quotable addresses · events: ${BOX.events}`;
  $("run").disabled = false;
  log(`box ready: ${BOX.cast.length} cast · ${BOX.hunt.length} hunt addresses · ${BOX.events} events.`);
} catch (e) { log("fatal: " + e.message); }

// 2. the mouth: WebLLM in the tab (the model runs here, no server, no heimdall)
let engine = null;
async function loadMouth() {
  const webllm = await import("https://esm.run/@mlc-ai/web-llm");
  log("WebLLM module loaded; fetching the model (first run downloads ~1GB)…");
  const initProgressCallback = (p) => { if (p && p.text) log("  " + p.text.slice(0, 110)); };
  engine = await webllm.CreateMLCEngine("Llama-3.2-1B-Instruct-q4f32_1-MLC", { initProgressCallback });
  log("mouth ready: Llama-3.2-1B (in-browser).");
}

$("run").addEventListener("click", async () => {
  $("run").disabled = true;
  try {
    if (!engine) await loadMouth();
    const huntLines = BOX.hunt.map((h) => `${h.marker}  (${h.s} ${h.v})`).join("\n");
    const prompt = `Write a literary essay of 4-5 paragraphs. TOPIC: ${BOX.topic}

Use ONLY these facts from the reading:
cast: ${BOX.cast.join(", ")}
deeds: ${BOX.deeds.join(", ")}
kinds: ${BOX.kinds.map(k=>`{${k.members.join(",")}}`).join(" ")}

You MUST quote the source by keeping these citation markers EXACTLY as written (the machine replaces each marker with the source's verbatim sentence):
${huntLines}

Rules: every paragraph must contain at least one marker, verbatim. Do not invent
names, deeds, or quotes. Write plain connected prose with a thesis. Plain text only.`;
    log("drawing the essay from the box (the mouth may only speak the box)…");
    const reply = await engine.chat.completions.create({ messages: [{ role: "user", content: prompt }], temperature: 0.4, max_tokens: 900 });
    const draft = reply.choices[0].message.content;
    log(`draft: ${draft.length} chars. Sealing (snip-cite grounds every quote)…`);

    // 3. seal: server replaces markers with verbatim bytes + tests
    const sealed = await (await fetch("/api/essay/seal", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ draft }) })).json();
    if (sealed.error) { log("seal error: " + sealed.error); return; }
    $("status").innerHTML = `<span class="badge ${sealed.verdict === "SEALED" ? "ok" : "bad"}">${sealed.verdict}</span> ${sealed.snips.filter(s=>s.verified).length} verbatim snips · ${sealed.refused.length} refused`;
    $("essay").innerHTML = sealed.text.split(/\n\n+/).map((p) => `<p>${p.replace(/“([^”]+)”/g, '<span class="q">“$1”</span>')}</p>`).join("");
    $("snips").innerHTML = sealed.snips.map((s) => s.verified ? `<div>✓ <span style="color:var(--ag)">“${s.quote.slice(0,90)}…”</span> <span class="pill">@${s.abs}</span></div>` : `<div>✗ refused @${s.abs} (${s.gap})</div>`).join("");
    $("essayCard").hidden = false;
    log("sealed. The essay is grounded — every quote is the source's own bytes.");
  } catch (e) { log("error: " + (e?.message || e)); }
  $("run").disabled = false;
});
</script>
</body>
</html>
