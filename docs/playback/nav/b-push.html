<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nav B — full-bleed push with a spine</title>
<style>
/* kernel.css — app tokens, the chat, the layer grammar (card / passage / page / entity / site), the one return pill.
   Everything a model changes is in its own file; everything here is common so the four models are compared on STACKING only. */
:root {
  --bg:#ffffff; --side:#ffffff; --side2:#f1f1f4; --line:#e4e4e9; --line2:#cfcfd7;
  --ink:#141416; --ink2:#44444e; --mut:#5f5f6b; --link:#1d4ed8; --on-ink:#ffffff;
  --ag:#0d7a70; --ag-soft:#e7f6f3; --warn:#a04a07; --shadow:0 8px 28px rgba(20,20,22,.16);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Lato,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:Georgia,'Times New Roman',serif;
  --vh:100dvh; --ret-left:12px; --dur:340ms; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg:#17171a; --side:#1c1c20; --side2:#29292e; --line:#2e2e33; --line2:#3f3f46;
  --ink:#f4f4f6; --ink2:#c9c9d2; --mut:#9d9da8; --link:#8ab4ff; --on-ink:#141416;
  --ag:#2dd4bf; --ag-soft:#0f2b27; --warn:#f0b429; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --dur:1ms; } }
* { box-sizing:border-box; }
html,body { height:100%; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--sans); overflow:hidden; overscroll-behavior:none; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit; -webkit-tap-highlight-color:transparent; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--link); outline-offset:2px; border-radius:6px; }
h1,h2,h3,p,ol,ul,blockquote { margin:0; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
[inert] { pointer-events:none; }

/* ---------- the app (chat) ---------- */
#app { position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg); }
.topbar { flex:none; height:48px; display:flex; align-items:center; gap:10px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--side); }
.topbar .brand { white-space:nowrap; font:600 13px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--mut); display:flex; gap:8px; align-items:center; }
.topbar .brand b { color:var(--ag); font-size:16px; letter-spacing:0; }
.topbar .sp { flex:1; }
.topbar .mname { font:500 11px/1 var(--mono); color:var(--mut); letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.themebtn { width:44px; height:44px; border-radius:999px; display:grid; place-items:center; color:var(--ink2); }
#chat { flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 14px 20px; -webkit-overflow-scrolling:touch; scroll-behavior:auto; }
.chat-in { max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:26px; }
.turn { display:flex; flex-direction:column; gap:10px; }
.ask { align-self:flex-end; max-width:86%; background:var(--side2); border-radius:16px 16px 4px 16px; padding:9px 13px; font-size:15px; }
.ans { font-size:16.5px; line-height:1.55; }
.ans .sent { display:block; margin:0 0 6px; }
.mark { display:inline-flex; align-items:center; gap:5px; min-height:44px; min-width:44px; padding:0 10px 0 6px; margin:-8px 0 -8px 2px; vertical-align:middle; color:var(--ag); font:600 12px/1 var(--mono); border-radius:999px; }
.mark i { font-style:normal; font-size:15px; }
.mark.pop { animation:ping 1.3s ease-out 1; }
@keyframes ping { 0%{ box-shadow:0 0 0 0 var(--ag); background:var(--ag-soft); } 100%{ box-shadow:0 0 0 14px transparent; background:transparent; } }
.srcs { display:flex; flex-wrap:wrap; gap:6px; }
.chip { display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:0 12px 0 8px; border:1px solid var(--line2); border-radius:999px; font-size:13px; color:var(--ink2); background:var(--side); }
.fav { width:22px; height:22px; border-radius:6px; display:inline-grid; place-items:center; font:700 12px/1 var(--sans); flex:none; border:1px solid color-mix(in srgb, currentColor 18%, transparent); }
.tag { font:500 11px/1.3 var(--mono); color:var(--mut); letter-spacing:.03em; }
.composer { flex:none; height:64px; border-top:1px solid var(--line); background:var(--side); display:flex; align-items:center; padding:0 14px; gap:10px; }
.composer .in { flex:1; height:44px; border:1px solid var(--line2); border-radius:22px; padding:0 16px; display:flex; align-items:center; color:var(--mut); font-size:15px; }

/* ---------- the return pill: one thumb, same corner, every layer, every model ---------- */
#ret { position:fixed; z-index:900; left:var(--ret-left); bottom:calc(12px + env(safe-area-inset-bottom,0px)); display:flex; gap:2px; max-width:calc(100vw - 24px); background:var(--ink); color:var(--on-ink); border-radius:999px; box-shadow:var(--shadow); transition:opacity 160ms, transform 200ms var(--ease); }
#ret[hidden] { display:flex; opacity:0; transform:translateY(12px); pointer-events:none; visibility:hidden; }
#ret button { height:44px; display:inline-flex; align-items:center; gap:6px; padding:0 16px; border-radius:999px; font:600 14px/1 var(--sans); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:44px; }
#ret button:focus-visible { outline-color:var(--on-ink); outline-offset:-4px; }
#ret .rb span { max-width:16ch; overflow:hidden; text-overflow:ellipsis; }
#ret .rc { border-left:1px solid color-mix(in srgb, var(--on-ink) 28%, transparent); border-radius:0 999px 999px 0; padding-right:18px; }
#ret .rb { padding-left:14px; }
#ret .rc[hidden] { display:none; }
#ret .rn { font:500 11px/1 var(--mono); opacity:.7; }

/* ---------- a layer (the model decides where it sits; this is what is in it) ---------- */
.layer { position:fixed; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); box-shadow:var(--shadow); overflow:hidden; }
.layer[hidden] { display:none; }
.l-head { flex:none; display:flex; align-items:center; gap:10px; min-height:52px; padding:6px 14px 6px 16px; border-bottom:1px solid var(--s-rule, var(--line)); }
.l-head .hk { font:600 10.5px/1 var(--mono); letter-spacing:.07em; text-transform:uppercase; opacity:.72; display:block; margin-bottom:4px; }
.l-head h2 { font:600 15px/1.25 var(--sans); letter-spacing:-.005em; }
.l-head h2:focus { outline:none; }
.l-head .hm { flex:1; min-width:0; }
.l-head .depth { font:600 11px/1 var(--mono); opacity:.7; flex:none; }
.l-body { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch; overscroll-behavior:contain; scroll-behavior:auto; }
.l-in { margin:0 auto; max-width:min(100%, var(--s-measure, 66ch)); }
.layer.app .l-in { max-width:640px; }

/* WEAR THE SITE: only the twelve validated tokens, applied as custom properties on the layer (see sitestyle.mjs) */
.wear, .layer.wear { background:var(--s-paper); color:var(--s-ink); font-family:var(--s-body); }
.wear .w-title { font-family:var(--s-title); font-weight:var(--s-tw); text-transform:var(--s-tcase); }
.wear .w-muted { color:var(--s-muted); }
.wear .w-link { color:var(--s-link); }
.wear .w-rule { border-color:var(--s-rule); }
.wear .l-head { border-bottom-color:var(--s-rule); }
.wear .l-head h2, .wear .l-head .hk { font-family:var(--s-title); }
.wear .l-head h2 { font-weight:var(--s-tw); text-transform:var(--s-tcase); }
.wear .l-head .hk { font-family:var(--mono); }
.wear .btn { border-color:var(--s-rule); border-radius:calc(var(--s-radius) + 6px); }
.wear :focus-visible { outline-color:var(--s-link); }

/* quotes: the page's sentence in the page's type */
.q { font-size:16px; line-height:1.55; }
.q b.ph { font-weight:700; }
.anchor { box-shadow:inset 3px 0 0 var(--s-accent); padding-left:12px; margin-left:-15px; }
.btn { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border:1px solid var(--line2); border-radius:12px; font:600 14px/1 var(--sans); color:inherit; text-decoration:none; }
.btn.go { background:var(--s-accent, var(--ink)); color:var(--s-paper, var(--bg)); border-color:transparent; }
a.btn:focus-visible { outline:2px solid var(--s-link, var(--link)); outline-offset:2px; }

/* card layer (app aesthetic; each evidence row wears its own site) */
.c-kicker { font:600 11px/1 var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--mut); margin-bottom:8px; }
.c-claim { font-size:17px; line-height:1.5; margin-bottom:8px; }
.c-state { font-size:13px; color:var(--ink2); margin-bottom:16px; }
.c-state.warn { color:var(--warn); }
.ev { display:block; width:100%; margin:0 0 12px; border:1px solid var(--s-rule, var(--line2)); border-radius:calc(var(--s-radius, 4px) + 4px); overflow:hidden; text-align:left; }
.ev .ev-top { display:flex; align-items:center; gap:8px; padding:9px 12px 0; font:600 12.5px/1 var(--sans); color:var(--s-muted); }
.ev .ev-top .dom { font-weight:400; opacity:.85; }
.ev .ev-top .go { margin-left:auto; font-weight:600; color:var(--s-link); white-space:nowrap; }
.ev .q { padding:8px 12px 10px; }
.ev .atoms { display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 12px; }
.atom { display:inline-flex; gap:6px; align-items:baseline; max-width:100%; padding:4px 8px; border:1px solid var(--s-rule); border-radius:6px; font:12.5px/1.3 var(--sans); color:var(--s-ink); background:color-mix(in srgb, var(--s-ink) 4%, transparent); }
.atom i { font:600 10px/1 var(--mono); font-style:normal; text-transform:uppercase; letter-spacing:.06em; color:var(--s-muted); }
.atom span { overflow-wrap:anywhere; }
.noatoms { font:12px/1.3 var(--mono); color:var(--s-muted); padding:0 12px 12px; }

/* passage / page */
.p-title { font-size:24px; line-height:1.18; margin:2px 0 14px; }
.p-site { display:flex; align-items:center; gap:8px; font:600 12.5px/1 var(--sans); color:var(--s-muted); margin-bottom:12px; }
.p-site .dom { font-weight:400; }
.p-line { font-size:17px; line-height:1.62; margin:0 0 14px; }
.p-gap { font:12px/1 var(--mono); color:var(--s-muted); margin:0 0 14px; letter-spacing:.2em; }
.p-actions { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 8px; }
.names { margin:18px 0 0; }
.names .nk { font:600 10.5px/1 var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--s-muted); margin-bottom:8px; display:block; }
.names .nl { display:flex; flex-wrap:wrap; gap:6px; }
.nm { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; border:1px solid var(--s-rule); border-radius:999px; font:600 13.5px/1 var(--sans); color:var(--s-ink); background:transparent; }
.nm small { font:500 11px/1 var(--mono); color:var(--s-muted); }
.nm.on { background:var(--s-accent); color:var(--s-paper); border-color:transparent; }
.nm.on small { color:inherit; opacity:.8; }
.p-line .en { font-weight:700; }
.meter { margin:0 0 16px; padding:10px 12px; border:1px dashed var(--s-rule); border-radius:calc(var(--s-radius) + 2px); font:12.5px/1.45 var(--sans); color:var(--s-muted); }
.meter .bar { display:block; height:4px; background:color-mix(in srgb, var(--s-ink) 12%, transparent); border-radius:2px; margin:7px 0 0; overflow:hidden; }
.meter .bar i { display:block; height:100%; background:var(--s-accent); }

/* entity layer */
.e-h { font-size:26px; line-height:1.15; margin:0 0 4px; font-family:var(--serif); }
.e-sub { font-size:13px; color:var(--ink2); margin-bottom:18px; }
.e-grp { margin:0 0 20px; }
.e-gh { display:flex; align-items:center; gap:8px; font:600 12.5px/1 var(--sans); color:var(--ink2); margin-bottom:8px; }
.e-gh .dom { font-weight:400; color:var(--mut); }
.e-more { min-height:44px; padding:0 12px; font:600 13px/1 var(--sans); color:var(--link); }
.ev.row .q { font-size:15.5px; }

/* site layer */
.s-dom { font-size:30px; line-height:1.1; margin:2px 0 6px; }
.s-sub { font-size:15px; margin-bottom:16px; }
.s-have { margin:0 0 16px; padding:12px 14px; border:1px solid var(--s-rule); border-radius:calc(var(--s-radius) + 4px); font:14px/1.5 var(--sans); }
.s-have b { font-weight:700; }
.s-no { margin:0 0 18px; font:13.5px/1.55 var(--sans); color:var(--s-muted); }
.sw { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px; }
.sw span { display:inline-flex; align-items:center; gap:6px; font:11.5px/1 var(--mono); color:var(--s-muted); }
.sw span i { width:20px; height:20px; border-radius:6px; border:1px solid var(--s-rule); display:inline-block; }
.s-basis { font:12px/1.5 var(--mono); color:var(--s-muted); margin:0 0 6px; }

/* the "you are here" cue on return */
.here { animation:here 1.2s ease-out 1; }
@keyframes here { 0%{ outline:3px solid var(--ag); outline-offset:3px; } 100%{ outline:3px solid transparent; outline-offset:8px; } }
.popover { position:fixed; z-index:950; background:var(--side); color:var(--ink); border:1px solid var(--line2); border-radius:14px; box-shadow:var(--shadow); padding:6px; min-width:220px; max-width:min(92vw, 340px); }
.popover[hidden] { display:none; }
.popover button { display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:0 12px; border-radius:10px; font:14px/1.2 var(--sans); }
.popover button[aria-current] { background:var(--side2); font-weight:700; }
.popover button .n { font:600 11px/1 var(--mono); color:var(--mut); width:16px; }
.badge { font:600 10px/1 var(--mono); letter-spacing:.05em; text-transform:uppercase; padding:3px 6px; border-radius:5px; border:1px solid currentColor; opacity:.8; white-space:nowrap; }

/* B — full-bleed push navigation: each layer is the whole screen, wearing its site; a persistent slim spine names where you are */
html[data-model="b"] .layer { left:0; right:0; top:44px; bottom:0; box-shadow:-10px 0 24px rgba(0,0,0,.16); touch-action:pan-y; will-change:transform; }
#spine { position:fixed; z-index:800; left:0; right:0; top:0; height:44px; display:flex; align-items:stretch; background:var(--side); color:var(--ink); border-bottom:3px solid var(--s-accent, var(--ag)); padding:0 4px; font:600 13.5px/1 var(--sans); }
#spine[hidden] { display:none; }
#spine ol { list-style:none; margin:0; padding:0; display:flex; align-items:stretch; min-width:0; flex:1; }
#spine li { display:flex; align-items:stretch; min-width:0; }
#spine li + li::before { content:"\203a"; align-self:center; padding:0 1px; color:var(--mut); font-size:16px; }
#spine li:first-child { flex:none; }
#spine li:last-child { flex:1 1 auto; min-width:0; }
#spine button, #spine .cur { display:flex; align-items:center; gap:7px; min-width:44px; height:44px; padding:0 10px; border-radius:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
#spine .cur { font-weight:800; }
#spine .dot { width:9px; height:9px; border-radius:50%; flex:none; background:var(--ag); }
#spine .lb { overflow:hidden; text-overflow:ellipsis; }
#spine .k { font:600 10px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
#spine button:focus-visible { outline-offset:-3px; }
#spine .more { color:var(--ink2); font:700 13px/1 var(--mono); }
@media (max-width:420px) { #spine li:nth-last-child(2) .lb { max-width:11ch; } #spine .k { display:none; } }
.edge { position:fixed; z-index:790; left:0; top:44px; bottom:0; width:22px; touch-action:pan-y; }

</style>
</head>

<script>window.__DATA__ = {"built":"prep.mjs","scenarios":[{"id":"wall","ask":"Is the Great Wall of China visible from space?","answer":["The Great Wall of China is not visible from space.","According to NASA, the wall is not as visible from orbit as modern desert roads."],"sources":[{"id":0,"domain":"skyatnightmagazine.com","site":"skyatnightmagazine.com","title":"Can you see the Great Wall of China from space? - BBC Sky at Night Magazine","url":"https://www.skyatnightmagazine.com/space-science/can-you-see-great-wall-china-from-space","chars":4840,"kept":1636,"via":"the fold's relay","clipped":false,"lap":0,"lines":[{"t":"When it comes to spaceflight and astronomy, many myths abound, one of the biggest being the idea that you can see the Great Wall of China from space."},{"t":"The truth is that the Great Wall of China cannot be seen from space."},{"t":"In fact, as early as 1754 the famed English scientist and antiquarian Rev. William Stukeley wrote in a private letter about \"the Chinese wall, which makes a considerable figure upon the terrestrial globe, and may be discerned at the Moon.\""},{"t":"Perhaps much of the presumption surrounding the Great Wall of China's visibility from the Moon came from 19th century Italian astronomer Giovanni Schiaparelli's observations of Mars, during which he observed what he called \"canali\" (channels)."},{"t":"Apollo 12 Lunar Module Pilot Alan Bean is quoted as saying: \"The only thing you can see from the Moon is a beautiful sphere, mostly white, some blue and patches of yellow, and every once in a while some green vegetation."},{"t":"\"No man-made object is visible at this scale.\""},{"t":"Well, on 24 November 2004, an image of the Great Wall of China was captured from low Earth orbit by US astronaut and International Space Station Commander Leroy Chiao."},{"t":"The image shows central Inner Mongolia, and the yellow arrow indicates an estimated location of 42.5N 117.4E, where the wall is visible, according to this great NASA webpage on the subject."},{"t":"And then there's ESA astronaut Alexander Gerst's photo of the Great Wall of China from space, captured from the International Space Station on 19 June 2018."},{"t":"This was confirmed by China's own first astronaut, Yang Liwei, who orbited Earth 14 times in October 2003 during the Chinese space agency's Shenzhou 5 mission."},{"t":"Surely, given the International Space Station's position in low-Earth orbit, astronauts living and working onboard the ISS would be the perfect candidates to prove or disprove whether the Great Wall of China can be seen with the naked eye from space."},{"t":"This was famously mistranslated into English as \"canals\", leading some English speakers to believe that the Martian structures had been built by an intelligent native populace."},{"t":"At the time, Gerst posted on social media: \"I think I finally found the answer to a question I've been asked a 1000 times."},{"t":"\"The Earth looked very beautiful from space, but I did not see our Great Wall,\" he said."}],"look":{"basis":"stand-in: bbc.com","page":"144ee36128c8886a27408856161f46332a704c12.body","light":{"tokens":{"paper":"#ffffff","ink":"#202122","muted":"#757576","link":"#b1574a","rule":"#e4e4e9","accent":"#b70402","bodyFont":"Georgia, \"Times New Roman\", serif","titleFont":"Georgia, \"Times New Roman\", serif","titleWeight":400,"titleCase":"none","measure":66,"radius":2},"scheme":"site-light","from":{"paper":"site-type","ink":"site-type","muted":"derived+contrast","link":"site-css+tinted","rule":"site-type","accent":"meta-theme-color+contrast","bodyFont":"site-type","titleFont":"site-type","titleWeight":"site-type","titleCase":"site-type","measure":"neutral","radius":"neutral"},"found":2,"contrast":{"ink":16.13,"muted":4.6,"link":4.87,"accent":6.91}},"dark":{"tokens":{"paper":"#1d100e","ink":"#e7e8e9","muted":"#8c8482","link":"#ffe0da","rule":"#392c2a","accent":"#c11810","bodyFont":"Georgia, \"Times New Roman\", serif","titleFont":"Georgia, \"Times ly that \"astronomers say\" the wall was the only human made object visible from the Moon, without naming a single astronomer."},{"t":"Apollo 11's Neil Armstrong said the wall is \"definitely not visible from the Moon\" to the naked eye."},{"t":"China's first taikonaut, Yang Liwei, told reporters in October 2003 that \"the Earth looked very beautiful from space, but I did not see our Great Wall,\" as reported by BBC Sky at Night Magazine."},{"t":"One arcminute is 1/60 of a degree, or about 2.9 x 10⁻⁴ radians."},{"t":"The Great Wall's widest sections run about 9 to 10 meters across."},{"t":"The International Space Station orbits roughly 400 kilometers, 400,000 meters, above the ground."},{"t":"The Great Wall itself is photographable, astronaut Leroy Chiao captured it from the ISS in 2004, but only with a telephoto lens, the same kind of equipment that turns an indistinct smear into a resolvable structure precisely because a lens can gather and magnify light in a way the naked eye cannot."},{"t":"No. At the Moon's distance, about 384,000 kilometers, the wall's angular size shrinks to a small fraction of what it is from low Earth orbit, making it far less visible than it already isn't from the ISS."},{"t":"The earliest trace is a 1754 letter by English antiquarian William Stukeley."},{"t":"\"The human eye is most sensitive to contrast, and the color of the wall is not that different from the ground on either side of it,\" he told Scientific American."},{"t":"Much of the wall is rammed earth and local stone, the same tan and gray palette as the terrain it crosses."},{"t":"The wall would need to be more than ten times wider than its actual 9 to 10 meters before an unaided eye in orbit could resolve it as a line at all, and that is before accounting for Hoffman's point about weak contrast, which makes the effective threshold even worse."},{"t":"At about 400 kilometers up the wall is roughly ten times narrower than human vision can resolve, and photographs of it from orbit have all required telephoto lenses."},{"t":"Is the Great Wall visible from the Moon?"},{"t":"NASA, image article on the Great Wall of China photographed from the ISS"}],"look":{"basis":"no cached page: SITE_TYPE or neutral","page":null,"light":{"tokens":{"paper":"#ffffff","ink":"#202122","muted":"#757576","link":"#2352cf","rule":"#e4e4e9","accent":"#2352cf","bodyFont":"Georgia, \"Times New Roman\", serif","titleFont":"Georgia, \"Times New Roman\", serif","titleWeight":400,"titleCase":"none","measure":66,"radius":2},"scheme":"site-light","from":{"paper":"site-type","ink":"site-type","muted":"derived+contrast","link":"neutral","rule":"site-type","accent":"link","bodyFont":"site-type","titleFont":"site-type","titleWeight":"site-type","titleCase":"site-type","measure":"neutral","radius":"neutral"},"found":0,"contrast":{"ink":16.13,"muted":4.6,"link":6.64,"accent":6.64}},"dark":{"tokens":{"paper":"#141414","ink":"#e7e8e9","muted":"#858687","link":"#8ab4ff","rule":"#303030","accent":"#8ab4ff","bodyFont":"Georgia, \"Times New Roman\", serif","titleFont":"Georgia, \"Times New Roman\", serif","titleWeight":400,"titleCase":"none","measure":66,"radius":2},"scheme":"derived-dark","from":{"paper":"site-type+derived-dark","ink":"site-type+flipped","muted":"derived","link":"neutral","rule":"site-type+derived","accent":"link","bodyFont":"site-type","titleFont":"site-type","titleWeight":"site-type","titleCase":"site-type","measure":"neutral","radius":"neutral"},"found":0,"contrast":{"ink":15.03,"muted":5.06,"link":8.84,"accent":8.84}},"fav":{"ch":"H","bg":"#f1f1f4","fg":"#44444e"},"stylesheet":null}},{"id":3,"domain":"chinahighlights.com","site":"chinahighlights.com","title":"Can the Great Wall Be Seen from Space? — It Depends! - China Highlights","url":"https://www.chinahighlights.com/greatwall/great-wall-from-space.htm","chars":4177,"kept":1057,"via":"direct","clipped":false,"lap":0,"lines":[{"t":"The Great Wall we see from Earth might be very magnificent, but it is only just pos 819,"kept":827,"via":"cached page text","clipped":false,"lap":0,"lines":[{"t":"a child under 2 years old has had a nosebleed"},{"t":"you have a nosebleed and you're taking a medicine that helps prevent blood clots, such as warfarin"},{"t":"you have a nosebleed and you have a condition that means your blood cannot clot properly, such as haemophilia"},{"t":"your nosebleed lasts longer than 10 to 15 minutes"},{"t":"conditions that affect the blood vessels or how the blood clots"},{"t":"How to stop a nosebleed yourself"},{"t":"sit down and lean forward, with your head tilted forward and your mouth open"},{"t":"pinch your nose just above your nostrils for 10 to 15 minutes"},{"t":"If you have a nosebleed and a doctor can see where the blood is coming from, they may use a stick with a chemical on it to stop the bleeding. This is pushed into the nostril to seal the area."},{"t":"After a nosebleed, to reduce the chance of another nosebleed, try not to do the following for 24 hours:"}],"look":{"basis":"own cached page","page":"0d580599812ebc2c52fef8efa30dc875269b60a9.body","light":{"tokens":{"paper":"#f0f4f5","ink":"#212b32","muted":"#676f75","link":"#2352cf","rule":"#ccd0d3","accent":"#2352cf","bodyFont":"-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif","titleFont":"-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif","titleWeight":400,"titleCase":"none","measure":66,"radius":2},"scheme":"site-light","from":{"paper":"site-css","ink":"site-css","muted":"derived+contrast","link":"neutral","rule":"site-type+derived","accent":"link","bodyFont":"site-css","titleFont":"body","titleWeight":"site-type","titleCase":"site-type","measure":"neutral","radius":"neutral"},"found":3,"contrast":{"ink":13.02,"muted":4.6,"link":5.99,"accent":5.99}},"dark":{"tokens":{"paper":"#141414","ink":"#ddeaf3","muted":"#80878c","link":"#8ab4ff","rule":"#2f3031","accent":"#8ab4ff","bodyFont":"-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif","titleFont":"-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif","titleWeight":400,"titleCase":"none","measure":66,"radius":2},"scheme":"derived-dark","from":{"paper":"site-css+derived-dark","ink":"site-css+flipped","muted":"derived","link":"neutral","rule":"site-type+derived","accent":"link","bodyFont":"site-css","titleFont":"body","titleWeight":"site-type","titleCase":"site-type","measure":"neutral","radius":"neutral"},"found":3,"contrast":{"ink":15.07,"muted":5.07,"link":8.84,"accent":8.84}},"fav":{"ch":"N","bg":"#f1f1f4","fg":"#44444e"},"stylesheet":null}},{"id":1,"domain":"wikihow.com","site":"wikiHow","title":"3 Ways to Stop a Nose Bleed","url":"https://www.wikihow.com/Stop-a-Nose-Bleed","chars":9305,"kept":3759,"via":"cached page text","clipped":false,"lap":0,"lines":[{"t":"1 Position your body. If you do not have a serious issue that led to your nose bleed, you can perform some first aid at home during a nose bleed to help stop it. To begin, sit down, since it is more comfortable than standing. Tilt head forward so that the blood drains through the nostrils. A towel can be held under your nose to collect the blood."},{"t":"2 Compress the nose. With a finger and thumb, pinch the lower fleshy end of the nose, completely blocking the nostrils. Pinching at this point directly applies pressure at the region where the blood vessels are damaged. This makes the move more effective since it will help stop the flow of blood. Keep pinching the nose for 10 minutes, then release. If bleeding continues, reapply pressure for another 10 minutes."},{"t":"4 Use oxymetazoline nasal sprays. While you have a nose bleed but not on a regular basis, you can try a medicated nose spray if you do not have high blood pressure issues. This medication causes constriction of the blood vessels in your nose. To use, take a small clean cotton ball or gauze piece, add 1-2 drops of the spray to it, insert them into the nostrils, continue pinching the nostrils, and check for bleeding after 10 minutes. If bleeding has stopped, do not remove the cotton or gauze for about an hour, because bleeding can reoccur."},{"t":"3 Increase your fiber intake. Constipation can lead to bearing down to pass hard stool, which causes an increase in nose bleeds because it strains your blood vessels. This can increase arterial pressure momentarily and dislodge blood clots covering previously injured blood vessels, which can eventually result in further nose bleeds. Constipation can be prevented by eating foods high in fiber and increasing your fluid intake."},{"t":"You should also avoid hot and spicy foods. Heat can dilate blood vessels and precipitate bleeding."},{"t":"2 Know the causes. There are many causes for nose bleeds. When you get one, you should assess which of the causes is most likely the reason you got your nose bleed and avoid the situation if at all possible in the future. You can get a nose bleed because of self-induced trauma, mostly as a result of nasal picking. This is the most common cause in young children. Other causes include substance abuse of drugs such as cocaine, blood vessel disorders, blood clotting disorders, and trauma to the head or face. Environmental factors such as low humidity, which is common during the winter, can induce mucosal irritation and bleeding. The incidence of nasal bleeding increases in colder weather."},{"t":"Infections of the nose and sinuses can cause a nose bleed. Allergies can also cause mucosal inflammation, which leads to nose bleeds."},{"t":"Trauma to the face can also cause a nose bleed to occur."},{"t":"To stop a nose bleed, start by tilting your head forward so the blood drains out your nostril and not down your throat. Then, pinch the lower fleshy end of your nose between your index finger and thumb and hold it like that for 10 minutes. If your nose is still bleeding after that, keep pinching it for an additional 10 minutes. You can also try sucking on an ice cube, which will lower your body temperature and reduce the blood flow to your nose. To learn how to prevent nose bleeds in the future, scroll down! Did this summary help you?YesNo"},{"t":"Kristina Jones Jul 2, 2016 \"Recently, it has been very, very hot and I have found myself waking up in the middle of the night with a nose bleed. Let me assure you, it is not pleasant waking up swallowing. We do have the A/C on, but it didn't seem to help. And so I came to wikiHow and found this article. I am not exactly sure what causes my nose bleeds, (I am like 90.99999% sure that it is from the heat) but now I know how to stop them, and slow them down so that I can get some sleep. :)\"...\" more"}],"look":{"basis":"own cached page","page":"41a84b1b2fc88b6ecf26651e2263ca51cd11d7f3.body","light":{"tokens":{"paper":"#f3f3f3","ink":"#525252","muted":"#6e6e6e","link":"#134b8b","rule":"#94b778","accent":"#134b8b","bodyFont":"-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif","titleFont":"-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif","titleWeight":700,"titleCase":"none","measure":80,"radius":4},"scheme":"site-light","from":{"paper":"site-css","ink":"site-css+contrast","muted":"derived+contrast","link":"site-css+tinted","rule":"site-css","accent":"link","bodyFont":"site-css","titleFont":"body","titleWeight":"site-css","titleCase":"site-type","measure":"site-css","radius":"site-css"},"found":8,"contrast":{"ink":7,"muted":4.6,"link":7.87,"accent":7.87}},"dark":{"tokens":{"paper":"#141414","ink":"#e8e8e8","muted":"#868686","link":"#4a81c5","rule":"#303030","accent":"#4a81c5","bodyFont":"-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif","titleFont":"-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif","titleWeight":700,"titleCase":"none","measure":80,"radius":4},"scheme":"derived-dark","from":{"paper":"site-css+derived-dark","ink":"site-css+flipped","muted":"derived","link":"site-css+ 903 they won the Nobel Prize for Physics for discovering radioactivity.","In 1911 she won the Nobel Prize for Chemistry for isolating pure radium."],"sources":[{"id":0,"domain":"britannica.com","site":"Britannica","title":"Marie Curie | Biography, Nobel Prize, Accomplishments, & Facts","url":"https://www.britannica.com/biography/Marie-Curie","chars":6380,"kept":2400,"via":"cached page text","clipped":false,"lap":0,"lines":[{"t":"Move to Paris, Pierre Curie, and first Nobel Prize"},{"t":"What did Marie Curie accomplish?"},{"t":"What awards did Marie Curie win?"},{"t":"The Nobel Prize - Marie and Pierre Curie and the discovery of polonium and radium"},{"t":"Working with her husband, Pierre Curie, Marie Curie discovered polonium and radium in 1898. In 1903 they won the Nobel Prize for Physics for discovering radioactivity. In 1911 she won the Nobel Prize for Chemistry for isolating pure radium. Following work on X-rays during World War I, she studied radioactive substances and their medical applications."},{"t":"With Henri Becquerel and her husband, Pierre Curie, Marie Curie was awarded the 1903 Nobel Prize for Physics. She was the sole winner of the 1911 Nobel Prize for Chemistry. She was the first woman to win a Nobel Prize and the only woman to win the award in two different fields."},{"t":"Marie Curie’s contributions to physics were immense, not only in her own work, as indicated by her two Nobel Prizes (Physics, 1903; Chemistry, 1911), but also through her influence on subsequent generations of nuclear physicists and chemists. Her work paved the way for the discovery of the neutron and artificial radioactivity."},{"t":"Marie Curie is most famous for her work on radioactivity. She was one of the first physicists to study the phenomenon. She and her husband, Pierre Curie, discovered two radioactive elements, polonium and radium. She also isolated pure radium. Marie Curie was the first woman to win a Nobel Prize and is the only woman to win a Nobel in two different fields."},{"t":"Marie Curie, with her husband, Pierre Curie, discovered two radioactive elements, polonium and radium. She was also able to isolate radium in its pure metallic state. She won the 1903 Nobel Prize for Physics, along with Pierre Curie and Henri Becquerel, for their work with radioactivity, and she won the 1911 Nobel Prize for Chemistry for her work in isolating radium."},{"t":"Marie Curie (born November 7, 1867, Warsaw, Congress Kingdom of Poland, Russian Empire—died July 4, 1934, near Sallanches, France) was a Polish-born French physicist, famous for her work on radioactivity and twice a winner of the Nobel Prize. With Henri Becquerel and her husband, Pierre Curie, she was awarded the 1903 Nobel Prize for Physics. She was the sole winner of the 1911 Nobel Prize for Chemistry. She was the first woman to win a Nobel Prize, and she is the only woman to win the award in two different fields."}],"look":{"basis":"own cached page","page":"0b1fd8ac3d3a2ed04c8470e666249ae10a663a4b.body","light":{"tokens":{"paper":"#ffffff","ink":"#1a1a1a","muted":"#707070","link":"#0f4c81","rule":"#d6d6d6","accent":"#0f4c81","bodyFont":"Georgia, \"Times New Roman\", serif","titleFont":"Georgia, \"Times New Roman\", serif","titleWeight":700,"titleCase":"none","measure":66,"radius":2},"scheme":"site-light","from":{"paper":"site-type","ink":"site-type","muted":"derived+contrast","link":"site-type","rule":"site-type+derived","accent":"site-type+contrast","bodyFont":"site-type","titleFont":"site-type","titleWeight":"site-type","titleCase":"site-type","measure":"neutral","radius":"neutral"},"found":0,"contrast":{"ink":17.4,"muted":4.93,"link":8.86,"accent":8.86}},"dark":{"tokens":{"paper":"#0e141b","ink":"#e8e8e8","muted":"#83868a","link":"#4a83bc","rule":"#2b3137","accent":"#2b649b","bodyFont":"Georgia, \"Times New Roman\", serif","titleFont":"Georgia, \"Times New Roman\", serif","titleWeight":700,"titleCase":"none","measure":66,"radius":2},"scheme":"derived-dark","from":{"paper":"site-type+derived-dark","ink":"site-type+flipped","muted":"derived","link":"site-type","rule":"site-type+derived","accent":"site-type+contrast","bodyFont":"site-type","titleFont":"site-type","titleWeight":"site-type","titleCase":"site-type","measure":"neutral","radius":"neutral"},"found":0,"contrast":{"ink":15.02,"muted":5.06,"link":4.6,"accent":3}},"fav":{"ch":"B","bg":"#0f4c81","fg":"#ffffff"},"stylesheet":"https://fonts.googleapis.com/icon?family=Material+Icons"}},{"id":1,"domain":"nobelprize.org","site":"NobelPrize.org","title":"MARIE CURIE","url":"https://www.nobelprize.org/stories/women-who-changed-science/marie-curie/","chars":5284,"kept":2995,"via":"cached page text","clipped":false,"lap":0,"lines":[{"t":"Marie Curie is still the only individual to receive the prize in two different science categories. Her relentless resolve and insatiable curiosity made her an icon in the world of modern science. Indefatigable despite a career of physically demanding and ultimately fatal work, she discovered polonium and radium, championed the use of radiation in medicine and fundamentally changed our understanding of radioactivity."},{"t":"Marie Curie was born Marya Skłodowska in 1867 in Warsaw. Her family struggled under a repressive Tsarist regime, which was trying to stamp out vestiges of Polish culture. Curie’s parents were Polish, and they were both teachers; their employment was precarious. Curie’s father moved from job to job, and the family to smaller and smaller apartments. When she was 11, Curie’s mother died of tuberculosis and her oldest sister of typhus."},{"t":"3 (of 5) Marie and Pierre Curie's thank you letter to the Royal Swedish Academy of Science (page 3), 19 November 1903"},{"t":"4 (of 5) Irène Curie and her mother Marie Curie at the Hoogstade Hospital in Belgium, 1915. Radiographic equipment is installed."},{"t":"For her research in “radiation phenomena,” Curie became, in 1903, the first woman to receive a Nobel Prize. French academics originally proposed only her husband and Henri Becquerel, but Pierre Curie insisted that his wife share the honour."},{"t":"In 1911, for the isolation of radium, she was awarded another Nobel Prize, this time in chemistry. She was and still is the only person to be awarded Nobel Prizes in two scientific categories. By that time, Curie was world-famous, and the director of the Curie Laboratory at the newly established Radium Institute (today the Curie Institute)."},{"t":"The tragic death of Pierre Curie"},{"t":"Pierre Curie was the love of Curie’s life and her partner in science. They met in 1894 when Marie Curie worked in Pierre Curie’s lab; they were married the following year. The couple had two daughters, Irène and Eve, and a few years after they married, Pierre Curie abandoned his own research to join his wife’s study of radioactivity. The Curies’ affair of the heart and mind ended tragically not long after Eve was born. In 1906, Pierre Curie was run over by a horse and carriage and killed."},{"t":"The Curies did not fully appreciate the danger of the radioactive materials they handled. Pierre Curie gave himself a lesion when he purposely exposed his arm to radium. Worse, however, was working for years in a poorly ventilated shed, isolating radium salts from tons of pitchblende ore."},{"t":"Both Curies were constantly ill from radiation sickness, and Marie Curie’s death from aplastic anemia in 1934, at age 66, was likely caused by radiation exposure. A few of her books and papers are still so radioactive that they are stored in lead boxes. For example, Marie Curie’s notebook from 1899–1902, containing notes from experiments on radioactive substances, is still radioactive and will be for 1,500 years. It seems fitting that Curie left a scientific legacy that is literally untouchable."}],"look":{"basis":"own cached page","page":"12abdf0ee343021fa068271df472df5dd9fa0844.body","light":{"tokens":{"paper":"#ffffff","ink":"#202122","muted":"#757576","link":"#2352cf","rule":"#e4e4e9","accent":"#2352cf","bodyFont":"Georgia, \"Times New Roman\", serif","titleFont":"Georgia, \"Times New Roman\", serif","titleWeight":400,"titleCase":"none","measure":66,"radius":8},"scheme":"site-light","from":{"paper":"site-type","ink":"site-type","muted":"derived+contrast","link":"neutral","rule":"site-type","accent":"link","bodyFont":"site-type","titleFont":"site-type","titleWeight":"site-type","titleCase":"site-type","measure":"neutral","radius":"site-css"},"found":1,"contrast":{"ink":16.13,"muted":4.6,"link":6.64,"accent":6.64}},"dark":{"tokens":{"paper":"#141414","ink":"#e7e8e9","muted":"#858687","link":"#8ab4ff","rule":"#303030","accent":"#8ab4ff","bodyFont":"Georgia, \"Times New Roman\", serif","titleFont":"Georgia, \"Times New Roman\", serif","titleWeight":400,"titleCase":"none","measure":66,"radius":8},"scheme":"derived-dark","from":{"paper":"site-type+derived-dark","ink":"site-type+flipped","muted":"derived","link":"neutral","rule":"site-type+derived","accent":"link","bodyFont":"site-type","titleFont":"site-type","titleWeight":"site-type","titleCase":"site-type","measure":"neutral","radius":"site-css"},"found":1,"contrast":{"ink":15.03,"muted":5.06,"link":8.84,"accent":8.84}},"fav":{"ch":"N","bg":"#f1f1f4","fg":"#44444e"},"stylesheet":"https://www.nobelprize.org/wp-content/plugins/nobelprize-block-library/dist/css/frontend-style.css?ver=479338bdb1657cc05d08"}},{"id":2,"domain":"nobelprize.org","site":"NobelPrize.org","title":"Marie Curie – Biographical","url":"https://www.nobelprize.org/prizes/physics/1903/marie-curie/biographical/","chars":1924,"kept":1924,"via":"cached page text","clipped":false,"lap":0,"lines":[{"t":"Nobel Prizes & laureates All Nobel Prizes"},{"t":"Her early researches, together with her husband, were often performed under difficult conditions, laboratory arrangements were poor and both had to undertake much teaching to earn a livelihood. The discovery of radioactivity by Henri Becquerel in 1896 inspired the Curies in their brilliant researches and analyses which led to the isolation of polonium, named after the country of Marie’s birth, and radium. Mme. Curie developed methods for the separation of radium from radioactive residues in sufficient quantities to allow for its characterization and the careful study of its properties, therapeutic properties in particular."},{"t":"Mme. Curie throughout her life actively promoted the use of radium to alleviate suffering and during World War I, assisted by her daughter, Irene, she personally devoted herself to this remedial work. She retained her enthusiasm for science throughout her life and did much to establish a radioactivity laboratory in her native city – in 1929 President Hoover of the United States presented her with a gift of $ 50,000, donated by American friends of science, to purchase radium for use in the laboratory in Warsaw."},{"t":"Mme. Curie, quiet, dignified and unassuming, was held in high esteem and admiration by scientists throughout the world. She was a member of the Conseil du Physique Solvay from 1911 until her death and since 1922 she had been a member of the Committee of Intellectual Co-operation of the League of Nations. Her work is recorded in numerous papers in scientific journals and she is the author of Recherches sur les Substances Radioactives (1904), L’Isotopie et les Éléments Isotopes and the classic Traité’ de Radioactivité (1910)."},{"t":"For further details, cf. Biography of Pierre Curie. Mme. Curie died in Savoy, France, after a short illness, on July 4, 1934."},{"t":"From Nobel Lectures, Physics 1901-1921, Elsevier Publishing Company, Amsterdam, 1967"}],"look":{"basis":"own cached page","page":"12abdf0ee343021fa068271df472df5dd9fa0844.body","light":{"tokens":{"paper":"#ffffff","ink":"#202122","muted":"#757576","link":"#2352cf","rule":"#e4e4e9","accent":"#2352cf","bodyFont":"Georgia, \"Times New Roman\", serif","titleFont":"Georgia, \"Times New Roman\", serif","titleWeight":400,"titleCase":"none","measure":66,"radius":8}     if (prev) prev.animate([{ transform: "translateX(0)", opacity: 1 }, { transform: "translateX(-22%)", opacity: 0.6 }], { duration: d, easing: EASE });
    return n.animate([{ transform: "translateX(100%)" }, { transform: "translateX(0)" }], { duration: d, easing: EASE }).finished;
  },
  leave(L, n, { stack }) {
    const prev = stack.length ? Nav.layerEl(stack[stack.length - 1]) : Nav.app, d = DUR(); const from = n._fromDx || 0;
    if (prev) prev.animate([{ transform: "translateX(-22%)", opacity: 0.6 }, { transform: "translateX(0)", opacity: 1 }], { duration: d, easing: EASE });
    return n.animate([{ transform: `translateX(${from}px)` }, { transform: "translateX(100%)" }], { duration: d, easing: EASE, fill: "forwards" }).finished;
  },
};
Nav.register(B);
})();
