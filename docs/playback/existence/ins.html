<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage 3 INS: page and clippings</title>
<style>
/* Shared by the three Existence mocks. Tokens are the app's own (index.html :root), light and dark. */
:root {
  color-scheme: light;
  --bg: #ffffff; --side: #ffffff; --side2: #f1f1f4; --line: #e4e4e9; --line2: #cfcfd7;
  --ink: #141416; --ink2: #44444e; --mut: #5f5f6b; --dim: #666673;
  --link: #1d4ed8; --on-link: #ffffff; --ag: #0d7a70; --ag-soft: #e7f6f3; --ok: #16793a; --bad: #c62828; --warn: #a04a07;
  --acc: #17171a; --shadow-sm: 0 1px 2px rgba(0,0,0,.08);
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --void: repeating-linear-gradient(135deg, var(--line2) 0 2px, transparent 2px 7px);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #17171a; --side: #1c1c20; --side2: #29292e; --line: #2e2e33; --line2: #3f3f46;
  --ink: #f4f4f6; --ink2: #c9c9d2; --mut: #9d9da8; --dim: #9494a0;
  --link: #8ab4ff; --on-link: #0b1220; --ag: #2dd4bf; --ag-soft: #0f2b27; --ok: #56d364; --bad: #f87171; --warn: #f0b429;
  --acc: #ededf0; --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #17171a; --side: #1c1c20; --side2: #29292e; --line: #2e2e33; --line2: #3f3f46;
    --ink: #f4f4f6; --ink2: #c9c9d2; --mut: #9d9da8; --dim: #9494a0;
    --link: #8ab4ff; --on-link: #0b1220; --ag: #2dd4bf; --ag-soft: #0f2b27; --ok: #56d364; --bad: #f87171; --warn: #f0b429;
    --acc: #ededf0; --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font: 15px/1.55 var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
a { color: var(--link); text-decoration: none; }
p { margin: 0; }
.mono { font-family: var(--mono); }
.kick { font: 600 10.5px/1.2 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--mut); }

/* mock-only controls: dashed, outside the product frame */
.mock { max-width: 1120px; margin: 8px auto 0; padding: 0 16px; font-size: 12.5px; color: var(--mut); }
.mock > summary { cursor: pointer; list-style: none; padding: 6px 10px; border: 1px dashed var(--line2); border-radius: var(--r-md); display: inline-block; font: 600 11px/1.2 var(--mono); }
.mock[open] > summary { margin-bottom: 8px; }
.mockrow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 10px; border: 1px dashed var(--line2); border-radius: var(--r-md); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r-pill); overflow: hidden; }
.seg button { padding: 4px 10px; font-size: 12px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--acc); color: var(--bg); }
.mockrow label { display: inline-flex; gap: 8px; align-items: center; }
.mockrow input[type=range] { width: 160px; accent-color: var(--link); }

/* the product frame: the reading panel */
.pv { max-width: 1120px; margin: 12px auto 24px; padding: 0 16px; }
.pv-in { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg); overflow: hidden; }
.pv-head { padding: 10px 14px 8px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.crumbs { font: 600 11px/1.3 var(--mono); color: var(--mut); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
.crumbs b { color: var(--ink); font-weight: 600; }
.crumbs .sep { color: var(--dim); }
.crumbs button { color: var(--mut); font: inherit; }
.crumbs button:hover { color: var(--ink); }
.cap { font-size: 14px; color: var(--ink2); }

.pv-body { display: grid; grid-template-columns: minmax(0, 1fr); }
.faces { min-width: 0; min-height: 440px; position: relative; outline: none; }
.face { padding: 14px; }
.face.in-zoomin { animation: fIn .24s ease-out both; }
.face.in-zoomout { animation: fOut .24s ease-out both; }
.face.in-pan { animation: fPan .24s ease-out both; }
@keyframes fIn { from { opacity: 0; transform: scale(.965); } }
@keyframes fOut { from { opacity: 0; transform: scale(1.035); } }
@keyframes fPan { from { opacity: 0; transform: translateX(22px); } }
@media (prefers-reduced-motion: reduce) { .face.in-zoomin, .face.in-zoomout, .face.in-pan { animation: none; } * { transition: none !important; } }

/* the neighbouring faces, as one line of what each found: the way to travel, not a menu */
.hints { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.hint { padding: 10px 14px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.hint + .hint { border-left: 1px solid var(--line); text-align: right; }
.hint:hover { background: var(--side2); }
.hint .kick { color: var(--link); }
.hint .say { font-size: 13px; line-height: 1.4; color: var(--ink2); }
.hint[disabled] { opacity: .5; cursor: default; }
.dots { display: flex; gap: 6px; align-items: center; justify-content: center; padding: 8px 0 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--mut); display: block; }
.dots i.on { background: var(--ink); border-color: var(--ink); width: 9px; height: 9px; }
.dots span { width: 18px; height: 1.5px; background: var(--line2); display: block; }
@media (min-width: 1000px) {
  .pv-body { grid-template-columns: 220px minmax(0, 1fr) 220px; }
  .hints { display: contents; }
  .hint { padding: 16px 14px; border-top: 0; }
  .hint:first-child { grid-column: 1; grid-row: 1; border-right: 1px solid var(--line); }
  .hint + .hint { grid-column: 3; grid-row: 1; border-left: 1px solid var(--line); }
  .faces { grid-column: 2; grid-row: 1; min-height: 520px; }
  .face { padding: 18px 22px; }
  .dots-wrap { display: none; }
}

/* favicon: the app's own pv-fav */
.fav { width: 18px; height: 18px; flex: none; border-radius: 4px; display: inline-grid; place-items: center; font: 700 10px/1 Georgia, serif; box-shadow: inset 0 0 0 1px var(--line); vertical-align: -4px; }
.fav.sm { width: 16px; height: 16px; font-size: 9px; border-radius: 3px; vertical-align: -3px; }
.fav.hollow { background: transparent !important; color: var(--mut) !important; box-shadow: inset 0 0 0 1.5px var(--line2); }
/* a face's own title line */
.ftitle { font-size: 13px; color: var(--ink2); margin-bottom: 12px; max-width: 62ch; }
.ftitle b { color: var(--ink); font-weight: 600; }
.gap { color: var(--mut); border: 1px dashed var(--line2); border-radius: var(--r-sm); padding: 1px 6px; font-size: 12.5px; }
.tag { font: 600 10px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--mut); }

.ins .mut { color: var(--mut); font-size: 13px; }
.ins .tl { margin-top: 12px; }
/* figure: page header in the margin, clippings pulled out as paper */
.ins .pg { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.ins .pg:first-of-type { border-top: 0; padding-top: 0; }
.ins .ph { display: grid; gap: 3px; align-content: start; }
.ins .ph .who { display: flex; align-items: center; gap: 8px; }
.ins .ph b { font-size: 13.5px; }
.ins .pt { font-size: 13px; color: var(--ink2); }
.ins .pm { font-size: 11.5px; color: var(--mut); }
.ins .clips { display: grid; gap: 10px; min-width: 0; }
.ins .clip { margin: 0; border: 1px solid; border-left-width: 4px; border-radius: 3px; padding: 8px 12px 10px; box-shadow: var(--shadow-sm); }
.ins .clip .ct { font: 600 10.5px/1.2 var(--mono); letter-spacing: .04em; text-transform: uppercase; opacity: .78; margin-bottom: 5px; }
.ins .clip .cb { display: block; width: 100%; line-height: 1.5; }
.ins .clip .cb .clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.ins .clip .cb span:not(.clamp) { white-space: pre-line; display: block; }
.ins .clip .cb2 { margin: 0; line-height: 1.5; }
.ins .clip.cited { border-left-color: var(--ag); border-width: 1px 1px 1px 6px; }
.ins .clip strong { font-weight: 700; }
.ins .quiet { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.ins .quiet ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.ins .quiet li { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink2); }
@container (min-width: 700px) {
  .ins .pg { grid-template-columns: 210px minmax(0, 1fr); gap: 18px; }
}
/* ground: rulers, one per page */
.ins .grows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ins .grow { border-bottom: 1px solid var(--line); padding: 8px 0 10px; }
.ins .gh { display: grid; gap: 3px; width: 100%; }
.ins .gh:hover .ttl { color: var(--link); }
.ins .gh .who { display: flex; gap: 8px; align-items: center; min-width: 0; }
.ins .gh b { font-size: 13.5px; flex: none; }
.ins .gh .ttl { font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ins .gh .out { font: 12px/1.3 var(--mono); color: var(--mut); }
.ins .rul { margin-top: 6px; }
.ins .pagebar { display: block; height: 14px; border: 1.5px solid var(--ink2); border-radius: 3px; position: relative; min-width: 6px; }
.ins .keptbar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); min-width: 2px; display: block; }
.ins .gmore { margin: 12px 0 4px; display: grid; gap: 10px; }
.ins .loupe { display: grid; }
.ins .loupe .lp { height: 22px; background: color-mix(in srgb, var(--ink) 14%, transparent); }
.ins .ktrack { position: relative; height: 14px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--bg); }
.ins .ktick { position: absolute; top: -1px; bottom: -1px; background: var(--ag); border-radius: 2px; min-width: 4px; }
.ins .cap2 { font-size: 12px; color: var(--mut); margin-top: 4px; }
.ins .pap .scroll { max-height: 280px; overflow: auto; }
.ins .pap { border: 1px solid; border-radius: 3px; padding: 12px 14px; box-shadow: var(--shadow-sm); max-width: 70ch; }
.ins .pap p { margin: 0 0 8px; line-height: 1.55; white-space: pre-line; }
.ins .pap .pt2 { font-size: 17px; border-bottom: 1px solid currentColor; padding-bottom: 4px; }
.ins .pap .torn { font: 12.5px/1.4 var(--sans); opacity: .85; border-top: 2px dotted currentColor; padding-top: 8px; margin: 10px 0 0; }
/* pattern: concordance */
.ins .chead, .ins .crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.ins .chead { margin-top: 8px; padding-bottom: 4px; }
.ins .dcols { display: grid; grid-auto-flow: column; grid-auto-columns: 22px; justify-items: center; align-items: center; padding: 0; }
.ins .crows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ins .crow { padding: 8px 0; border-bottom: 1px solid var(--line); }
.ins .ctx { font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
.ins .ctx.mono { font-size: 13.5px; }
.ins .cn { display: block; font-style: normal; font: 11.5px/1.4 var(--mono); color: var(--mut); }
.ins .dot.y { color: var(--ink); font-size: 14px; }
.ins .dot.n { color: var(--ink2); }
.ins .legend2 { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 12.5px; color: var(--ink2); }
.ins .legend2 span { display: inline-flex; gap: 6px; align-items: center; }

</style>
</head>

s and marks part of the China–Nepal border at its summit. Its height was most recently measured in 2020 through a joint survey by Nepalese and Chinese authorities as 8,848.86 m (29,031 ft 8+1⁄2 in). Mount Everest attracts many climbers, including highly experienced mountaineers. There are two main climbing routes, one approaching the summit from the southeast in Nepal (known as the standard route) and the other from the north in China. While not posing substantial technical climbing challenges on the standard route, Everest presents dangers such as altitude sickness, weather, and wind, as well as hazards from avalanches and the Khumbu Icefall. As of May 2024, 340 people have died on Everest. Over 200 bodies remain on the mountain and have not been removed due to the dangerous conditions. Climbers typically ascend only part of Mount Everest's elevation, as the mountain's full elevation is measured from the geoid, which approximates sea level. The closest sea to Mount Everest's summit is the Bay of Bengal, almost 700 km (430 mi) away. To approximate a climb of the entire height of Mount Everest, one would need to start from this coastline, a feat accomplished by T","note":"kept 2,973 of 24,000 chars","ms":23,"via":"direct","notUsed":false},{"url":"https://www.britannica.com/place/Mount-Everest","domain":"britannica.com","site":"britannica.com","title":"Mount Everest | Height, Map, Deaths, Facts, & Climbers | Britannica","lap":2,"t0":45.474,"t1":45.497,"state":"unread","chars":0,"kept":0,"text":"","note":"no text came back","ms":24,"via":null,"notUsed":false},{"url":"https://pathfindertreks.com/how-tall-is-mount-everest-the-ultimate-guide/","domain":"pathfindertreks.com","site":"pathfindertreks.com","title":"Everest Height - Official Mount Everest Height in Feet & Meters","lap":2,"t0":45.474,"t1":58.921,"state":"unread","chars":0,"kept":0,"text":"","note":"no text came back","ms":13445,"via":null,"notUsed":false},{"url":"https://nepaltrekkingplanner.com/blogs/mount-eve lnepal.com","title":"How Tall is Mount Everest? Height in Feet & Meters 2026","text":"Mount Everest is 8,848.86 metres (29,031.7 feet) above sea level. It replaced the 8,848 m figure that had stood since 1955, and it is the height recognised by both governments today. The full record of who has stood on top, and who did not come back, is in the summit and fatality list from 1953 onward. Rounded off, that is about 8.85 kilometers or 5.5 miles of vertical distance. Everest Is an Outlier Even Among the 8,000-Metre Peaks Everest rises about 250 metres above the next tallest peak in the Himalaya, which is a far larger gap than separates the peaks immediately below it. Chimborazo, Ecuador sits near the equatorial bulge, so its summit is roughly 2,100 m further from the centre of the Earth than Everest’s, despite reaching only 6,263 m above sea level. Everest also has a modest base-to-summit rise by mountaineering standards, because the Tibetan Plateau it sits on is already abo…"},{"lap":2,"n":3,"of":4,"at":46.203,"ref":"education.nationalgeographic.org — Mount Everest - National Geographic Society","url":"https://education.nationalgeographic.org/resource/mount-everest/","domain":"education.nationalgeographic.org","site":"education.nationalgeographic.org","title":"Mount Everest - National Geographic Society","text":"Mount Everest is the highest of the Himalayan mountains, and—at 8,850 meters (29,035 feet)—is considered the highest point on Earth. Mount Everest is a peak in the Himalaya mountain range. At 8,849 meters (29,032 feet), it is considered the tallest point on Earth. This is why the area above 8,000 meters (26,000 feet) elevation on Everest is called the “death zone.” chemical element with the symbol O, whose gas form is 21% of the Earth's atmosphere."},{"lap":2,"n":4,"of":4,"at":47.103,"ref":"britannica.com — Mount Everest - Himalayas, Summit, Peak | Britannica","url":"https://www.britannica.com/place/Mount-Everest/The-height-of-Everest","domain":"britannica.com" 029 feet). 1963: Jim Whittaker became the first American to ascend Everest. A typical Everest climb is 6–9 weeks long, and most of those weeks are spent acclimatizing and not climbing. Death Zone is applied to refe…"}],"handed":[{"url":"https://en.wikipedia.org/wiki/Mount_Everest","domain":"en.wikipedia.org","ref":"en.wikipedia.org — Mount Everest - Wikipedia","text":"Mount Everest (known in Nepali as Sagarmāthā, in Sherpa as Chamolangma, and in Tibetan as Jomolangma/Čhomolangma is the highest mountain on Earth above sea level.\nAs of May 2024, 340 people have died on Everest.\nThe closest sea to Mount Everest's summit is the Bay of Bengal, almost 700 km (430 mi) away.\nTo approximate a climb of the entire height of Mount Everest, one would need to start from this coastline, a feat accomplished by Tim Macartney-Snape's team in 1990.\nDespite Everest's objections, Waugh's proposed name prevailed, and the Royal Geographical Society officially adopted the name \"Mount Everest\" in 1865.\nIn 1955, a detailed photogrammetric map (at a scale of 1:50,000) of the Khumbu region, including the south side of Mount Everest, was made by Erwin Schneider as part of the 1955 International Himalayan Expedition, which also attempted Lhotse.\nThis is despite Chimborazo having a peak of 6,268 m (20,564.3 ft) above sea level versus Mount Everest's 8,848 m (29,028.9 ft).\nMany of the highest mountains in the world are near Mount Everest, for example Lhotse, 8,516 m (27,940 ft); Nuptse, 7,855 m (25,771 ft), Changtse, 7,580 m (24,870 ft) and Khumbutse, 6,636 m (21,772 ft).\nA thick, white-weathering thrombolite bed that is 60 m (200 ft) thick comprises the foot of the \"Third Step\", and base of the summit pyramid of Everest.\nThis bed, which crops out starting about 70 m (230 ft) below the summit of Mount Everest, consists of sediments trapped, bound, and cemented by the biofilms of micro-organisms, especially cyanobacteria, in shallow marine waters.\nThe bulk of Mount Everest, between 7,000 and 8,600 m (23,000 and 28,200 ft), consists of the North Col Formation, of which the Yellow Band forms the upper part between 8,200 to 8,600 m (26,900 to 28,200 ft).\nThe remainder of the North Col Formation, exposed between 7,000 to 8,200 m (23,000 to 26,900 ft) on Mount Everest, consists of interlayered and deformed schist, phyllite, and minor marble.\nBelow 7,000 m (23,000 ft), the Rongbuk Formation underlies the North Col Formation and forms the base of Mount Everest.\nMount Everest is rising by about 2 mm per year.\nIn respect of the recognition of the \"highest rocks on the planet\" as fossiliferous, marine limestone, the Ordovician Rocks of Mount Everest were included by the International Union of Geological Sciences (IUGS) in its assemblage of 100 geological heritage "},{"url":"https://www.magicalnepal.com/blog/how-tall-is-mount-everest/","domain":"magicalnepal.com","ref":"magicalnepal.com — How Tall is Mount Everest? Height in Feet & Meters 2026","text":"How Tall is Mount Everest?\nMount Everest is 8,848.86 metres (29,031.7 feet) above sea level.\nIt replaced the 8,848 m figure that had stood since 1955, and it is the height recognised by both governments today.\nThe peak is still rising by roughly 2 mm a year, faster than tectonics alone explains\nEverest Base Camp sits at 5,364 m, and Kala Patthar at 5,545 m, around 63 percent of the summit altitude\nThe full record of who has stood on top, and who did not come back, is in the summit and fatality list from 1953 onward.\nRounded off, that is about 8.85 kilometers or 5.5 miles of vertical distance.\nCorrecting for this requires a dedicated gravity survey of the region, which is precisely why Nepal’s 2019 fieldwork included gravimetric readings alongside satellite positioning.\nThe 2005 figure of 8,844.43 m therefore remains the only rock height in circulation, and it is fifteen years older than the snow figure beside it.\nThe measurement was taken from six observation stations on the plains of what is now northern India and Nepal’s Terai, some more than 170 kilometres from the summit.\nThe naming followed in 1865, when the Royal Geographical Society adopted Waugh’s proposal to honour his predecessor George Everest.\nThe 29,002-foot figure is also the origin of a long-running story.\nHow Has Everest’s Official Height Changed Since 1856?\nHow Did Nepal and China Settle the Everest Elevation in 2020?\nEverest Is an Outlier Even Among the 8,000-Metre Peaks\nEverest rises about 250 metres above the next tallest peak in the Himalaya, which is a far larger gap than separates the peaks immediately below it.\nChimborazo, Ecuador sits near the equatorial bulge, so its summit is roughly 2,100 m further from the centre of the Earth than Everest’s, despite reaching only 6,263 m above sea level.\nEverest also has a modest base-to-summit rise by mountaineering standards, because the Tibetan Plateau it sits on is already above 4,000 m.\nMeasured from Base Camp, the climb is around 3,500 m, less than the vertical relief on Denali or Nanga Parbat.\nThe clearest view on the standard route comes from Kala Patthar, which is why groups leave Gorak Shep at 4 am to be on that ridge at sunrise.\nThe standard Everest Base Camp trek runs 14 days from Kathmandu and costs around USD 1500 – USD 2500 based on how you travel.\nFull expedition packages on the south side average around USD 55,000 to 60,000, perm"},{"url":"https://education.nationalgeographic.org/resource/mount-everest/","domain":"education.nationalgeographic.org","ref":"education.nationalgeographic.org — Mount Everest - National Geographic Society","text":"Mount Everest is the highest point on Earth.\nMount Everest is the highest of the Himalayan mountains, and—at 8,850 meters (29,035 feet)—is considered the highest point on Earth.\nAt 8,849 meters (29,032 feet), it is considered the tallest point on Earth.\nThis is why the area above 8,000 meters (26,000 feet) elevation on Everest is called the “death zone.”\nchemical element with the symbol O, whose gas form is 21% of the Earth's atmosphere."},{"url":"https://en.wikipedia.org/wiki/Mount_Everest","domain":"en.wikipedia.org","ref":"en.wikipedia.org — Mount Everest - Wikipedia","text":"Its height was most recently measured in 2020 through a joint survey by Nepalese and Chinese authorities as 8,848.86 m (29,031 ft 8+1⁄2 in).\nThe closest sea to Mount Everest's summit is the Bay of Bengal, almost 700 km (430 mi) away.\nWaugh is sometimes playfully credited with being \"the first person to put two feet on top of Mount Everest\".\nIn 2010, both sides agreed that the height of Everest is 8,848 m, and Nepal recognises China's claim that the rock height of Everest is 8,844 m.\nOn 8 December 2020, it was jointly announced by the two countries that the new official height is 8,848.86 metres (29,031.7 ft).\nMauna Kea in Hawaii is tallest when measured from its base; it rises over 10,200 m (33,464.6 ft) from its base on the mid-ocean floor, but only attains 4,205 m (13,796 ft) above sea level.\nThe summit of Chimborazo in Ecuador is 2,168 m (7,113 ft) farther from Earth's centre (6,384.4 km or 3,967.1 mi) than that of Everest (6,382.3 km, 3,965.8 mi), because the Earth bulges at the equator.\nThis is despite Chimborazo having a peak of 6,268 m (20,564.3 ft) above sea level versus Mount Everest's 8,848 m (29,028.9 ft).\nMany of the highest mountains in the world are near Mount Everest, for example Lhotse, 8,516 m (27,940 ft); Nuptse, 7,855 m (25,771 ft), Changtse, 7,580 m (24,870 ft) and Khumbutse, 6,636 m (21,772 ft).\nMount Everest is rising by about 2 mm per year."},{"url":"https://www.magicalnepal.com/blog/how-tall-is-mount-everest/","domain":"magicalnepal.com","ref":"magicalnepal.com — How Tall is Mount Everest? Height in Feet & Meters 2026","text":"Mount Everest is 8,848.86 metres (29,031.7 feet) above sea level.\nIt replaced the 8,848 m figure that had stood since 1955, and it is the height recognised by both governments today.\nThe full record of who has stood on top, and who did not come back, is in the summit and fatality list from 1953 onward.\nRounded off, that is about 8.85 kilometers or 5.5 miles of vertical distance.\nEverest Is an Outlier Even Among the 8,000-Metre Peaks\nEverest rises about 250 metres above the next tallest peak in the Himalaya, which is a far larger gap than separates the peaks immediately below it.\nChimborazo, Ecuador sits near the equatorial bulge, so its summit is roughly 2,100 m further from the centre of the Earth than Everest’s, despite reaching only 6,263 m above sea level.\nEverest also has a modest base-to-summit rise by mountaineering standards, because the Tibetan Plateau it sits on is already above 4,000 m.\nFull expedition packages on the south side average around USD 55,000 to 60,000, permit validity dropped from 75 days to 55 in the same rule change, and one guide is now mandatory for every two climbers on any peak above 8,000 meters.\nMount Everest stands 8,848.86 meters, or 29,031.7 feet, above sea level.\nThe remaining 39 percent is where Everest stops being a destination and becomes a mountaineering problem.\n29,031.7 feet, or 29,031 feet and 8.5 inches."},{"url":"https://education.nationalgeographic.org/resource/mount-everest/","domain":"education.nationalgeographic.org","ref":"education.nationalgeographic.org — Mount Everest - National Geographic Society","text":"Mount Everest is the highest of the Himalayan mountains, and—at 8,850 meters (29,035 feet)—is considered the highest point on Earth.\nMount Everest is a peak in the Himalaya mountain range.\nAt 8,849 meters (29,032 feet), it is considered the tallest point on Earth.\nThis is why the area above 8,000 meters (26,000 feet) elevation on Everest is called the “death zone.”\nchemical element with the symbol O, whose gas form is 21% of the Earth's atmosphere."},{"url":"https://www.britannica.com/place/Mount-Everest/The-height-of-Everest","domain":"britannica.com","ref":"britannica.com — Mount Everest - Himalayas, Summit, Peak | Britannica","text":"University of Montana - Mount Everest Discovery and the First Ascent 64 Years Ago\nNational Public Radio - How tall is Mount Everest?\nMount Everest - Children's Encyclopedia (Ages 8-11)\nControversy over the exact elevation of the summit developed because of variations in snow level, gravity deviation, and light refraction.\nThe figure 29,028 feet (8,848 meters), plus or minus a fraction, was established by the Survey of India between 1952 and 1954 and became widely accepted.\nA Chinese survey in 1975 obtained the figure of 29,029.24 feet (8,848.11 meters), and an Italian survey, using satellite surveying techniques, obtained a value of 29,108 feet (8,872 meters) in 1987, but questions arose about the methods used.\nIn 1992 another Italian survey, using the Global Positioning System (GPS) and laser measurement technology, yielded the figure 29,023 feet (8,846 meters) by subtracting from the measured height 6.5 feet (2 meters) of ice and snow on the summit, but the methodology used was again called into question.\nThe result of this was what the Chinese called a “rock height” of 29,017.12 feet (8,844.43 meters), which, though widely reported in the media, was recognized only by China for the next several years.\nIn December 2020 China and Nepal jointly declared that the height of Everest was 29,031.69 feet (8,848.86 meters)."},{"url":"https://nepaltrekkingplanner.com/blogs/mount-everest","domain":"nepaltrekkingplanner.com","ref":"nepaltrekkingplanner.com — Mount Everest at 8,848.86 meters (29,031.7 feet)","text":"Mount Everest at 8,848.86 meters (29,031.7 feet)\nThey initially put its height at 8,840 meters (29,002 feet).\nIn 1955, an Indian survey measured the height as 8,848 meters (29,029 feet), a measurement that has remained for decades and gained global recognition.\nChina measured Everest at 8,844.43 m in 2005.\nThe mountain was given the name Mount Everest by the British Survey of India in the mid-19th century.\nOn May 29, 1953, after decades of futile efforts and tragic losses, New Zealand's Sir Edmund Hillary and Nepal's Tenzing Norgay Sherpa successfully became the first documented climbers to conquer the peak of Mount Everest, then the highest point on Earth at 8,848 meters (29,029 feet).\n1963: Jim Whittaker became the first American to ascend Everest.\nA typical Everest climb is 6–9 weeks long, and most of those weeks are spent acclimatizing and not climbing.\nDeath Zone is applied to refer to altitudes above 8,000 meters (26,247 feet) on Mount Everest, at which the air is too thin for the human body to acclimatize sufficiently to survive even for an extended period of time.\nAt such heights, the oxygen content drops to about 30% of the sea level content, so each step becomes physically crippling, and each decision is a question of life or death.\nHeight and Growth – Everest stands at 8,848.86 meters (29,029.2 feet) high, a height confirmed in 2020 by Nepal and China.\nIt ends at Everest Base Camp, which is at an altitude of 5,364 meters (17,598 feet) on the south face of Everest.\nNamche Bazaar (3,440 m): The famous and vibrant village of Everest, which has hotels, lodges, restaurants, pubs, cafes, monasteries, and stupas.\nAbove 8000 meters, the fatigue can catch up, making the climbers feel exhausted."}],"cited":[{"n":"S1","domain":"magicalnepal.com","url":"https://www.magicalnepal.com/blog/how-tall-is-mount-everest/","ref":"magicalnepal.com — How Tall is Mount Everest? Height in Feet & Meters 2026","label":"magicalnepal.com — How Tall is Mount Everest? Height in Feet & Meters 2026","text":"Mount Everest stands 8,848.86 meters, or 29,031.7 feet, above sea level .","mark":"29,031.7 feet, above sea level","before":"Mount Everest stands 8,848.86 meters, or","after":".","span":{"start":1186,"end":1216},"keptLen":2945,"chars":20389}],"claims":[{"text":"Mount Everest is 8,848.86 meters (29,031.7 feet) above sea level.","grounded":true,"tag":"S1"}],"loop":{"processLine":"ref :"read","chars":6330,"kept":101,"text":"What was revolutionary about the iPhone’s interface? Our editors will review what you’ve submitted and determine whether to revise the article. National Museums Scotland - Did Alexander Graham Bell invent the telephone? PBS - American Experience - The Development of the Telephone Social Sci LibreTexts - Electrifying Communication- The Telegraph and Telephone Elon University - Imagining the Internet - 1870s ï¿½ 1940s: Telephone ABC listen - The History Listen - An Object in Time - The Telephone Clemson University Open Textbooks - Science Technology and Society a Student Led Exploration - The Invention of the Telephone BBC News - Do we still need the telephone? telephone - Children's Encyclopedia (Ages 8-11) telephone - Student Encyclopedia (Ages 11 and up) A telephone is an instrument designed for the simultaneous transmission and reception of the human voice. Telephones are inexpensive and simple to operate, and they offer an immediate, personal type of communication. Billions of telephones are in use around the world. On February 14, 1876, Alexander Graham Bell applied for a U.S. patent for the telephone. On March 7, 1876, Bell was awarded U.S. patent 174,465. This patent is often referred to as the most valuable ever issued by the U.S. Patent Office, as it described not only the telephone instrument but also the concept of a telephone system. When was the telephone introduced","note":"kept 101 of 6,330 chars","ms":7332,"via":"the fold's relay","notUsed":false},{"url":"https://www.sciencefocus.com/science/who-really-invented-the-telephone","domain":"sciencefocus.com","site":"sciencefocus.com","title":"Who really invented the telephone? - BBC Science Focus Magazine","lap":1,"t0":14.677,"t1":22.519,"state":"read","chars":4110,"kept":195,"text":"While credit is typically awarded to Alexander Graham Bell (see main image) and his US patent in 1876, does the famous inventor deserve all the credit when it comes to who invented the telephone? It’s long been the subject of debate, and the importance of scientists and inventors before Graham Bell – including Italian Antonio Meucci and German inventor Johann Philipp Reis – is often discussed. Similar to the invention of the lightbulb (see: who invented the lightbulb?), it’s tricky to give any one person full credit for an innovation. There are various names and iterations of devices, with scientific breakthroughs leading to scientific breakthroughs until we get to the item that popularises the science and makes it viable for everyday and commercial use. W Scottish engineer Alexander Graham Bell is credited with inventing the telephone, patenting the world's first telephone on 7 March 1876. On creating the telephone, Graham Bell called his assistant Thomas A Watson in the next room using another device. Graham Bell is reported to have said: “Mr Watson – come here – I want to see you.” Without the work of various other scientists and inventors, however, this moment likely would not have happened. Many in Italy claim that it was in fact Antonio Meucci who invented the telephone and some in Germany insist it was Johann Philipp Reis. In truth, it’s almost impossible to clearly pinp","note":"kept 195 of 4,110 chars","ms":7842,"via":"the fold's relay","notUsed":false},{"url":"https://en.wikipedia.org/wiki/History_of_the_telephone","domain":"en.wikipedia.org","site":"en.wikipedia.org","title":"History of the telephone - Wikipedia","lap":1,"t0":14.681,"t1":15.311,"state":"read","chars":24000,"kept":2960,"text":"This history of the telephone chronicles the development of the electrical telephone, and includes a brief overview of its predecessors. The first telephone patent was granted to Alexander Graham Bell in 1876. == Mechanical acoustic == Before the invention of electromagnetic telephones, mechanical acoustic devices existed for transmitting speech and music over a greater distance. This distance was greater than that of normal direct speech. The earliest mechanical telephones were based on sound transmission through pipes or other physical media. The acoustic tin can telephone, or \"lovers' phone\", has been known for centuries. Some of the earliest known experiments were conducted by the British physicist and polymath, Robert Hooke, from 1664 to 1685. An acoustic string phone made in 1667 has been attributed to him. An early version was also found in use by the Chimu in Peru. The gourd and stretched-hide version resides in the Smithsonian Museum collection and dates back to around the 7th century AD. For a few years in the late 1800s, acoustic telephones were marketed commercially as a competitor to the electrical telephone. When the Bell telephone patents expired and many new telephone manufacturers began competing, acoustic telephone makers quickly went out of business. Their maximum range was very limited. An example of one such company was the Pulsion Telephone Supply Company ","note":"kept 2,960 of 24,000 chars","ms":627,"via":"direct","notUsed":false},{"url":"https://www.loc.gov/everyday-mysteries/categories/technology/item/who-is-credited-with-inventing-the-telephone","domain":"loc.gov","site":"loc.gov","title":"Who is credited with inventing the telephone? - Library of Congress","lap":1,"t0":15.337,"t1":28.149,"state":"unread","chars":0,"kept":0,"text":"","note":"no text came back","ms":12829,"via":null,"notUsed":false},{"url":"https://www.history.com/articles/alexander-graham-bell","domain":"history.com","site":"history.com","title":"Alexander Graham Bell: Telephone & Inventions | HISTORY","lap":1,"t0":22.006,"t1":28.826,"state":"read","chars":10358,"kept":667,"text":"Alexander Graham Bell, best known for his invention of the telephone, revolutionized communication as we know it. His interest in sound technology was deep-rooted and personal, as both his wife and mother were deaf. While there’s some controversy over whether Bell was the true pioneer of the telephone, he secured exclusive rights to the technology and launched the Bell Telephone Company in 1877. Ultimately, the talented scientist held more than 18 patents for his inventions and work in communications. Alexander Graham Bell was born in Edinburgh, Scotland, on March 3, 1847. Bell’s father was a professor of speech elocution at the University of Edinburgh and his mother, despite being deaf, was an accomplished pianist. Young Alexander was an intellectually curious child who studied piano and began inventing things at an early age. Both of his brothers passed away from tuberculosis by the time Bell was in his early twenties. Initially, Bell’s education consisted of homeschooling. Bell didn’t excel academically, but he was a problem solver from an early age. When he was just 12, the young Alexander invented a device with rotating paddles and nail brushes that could quickly remove husks from wheat grain to help improve a farming process. At age 16, Bell began studying the mechanics of speech. He went on to attend Royal High School and the University of Edinburgh. In 1870, Bell, along","note":"kept 667 of 10,358 chars","ms":6822,"via":"the fold's relay","notUsed":true}],"quick":[{"lap":1,"n":1,"of":3,"at":28.882,"ref":"britannica.com — Telephone | History, Definition, Invention, Uses, & Facts | Britannica","url":"https://www.britannica.com/technology/telephone","domain":"britannica.com","site":"britannica.com","title":"Telephone | History, Definition, Invention, Uses, & Facts | Britannica","text":"What was revolutionary about the iPhone’s interface? Who is credited as the inventor of the telephone?"},{"lap":1,"n":2,"of":3,"at":29.782,"ref":"sciencefocus.com — Who really invented the telephone? - BBC Science Focus Magazine","url":"https://www.sciencefocus.com/science/who-really-invented-the-telephone","domain":"sciencefocus.com","site":"sciencefocus.com","title":"Who really invented the telephone? - BBC Science Focus Magazine","text":"While credit is typically awarded to Alexander Graham Bell (see main imag n Western Australia (and subsequently had her sentence commuted to life imprisonment). 25 women were executed in Australia between 1789 and 1951. == History == Before the arrival of Europeans, death sentences were carried ","note":"kept 2,970 of 22,640 chars","ms":233,"via":"direct","notUsed":false},{"url":"https://en.wikipedia.org/wiki/States_and_territories_of_Australia","domain":"en.wikipedia.org","site":"Wikipedia","title":"States and territories of Australia","lap":1,"t0":6.367,"t1":6.63,"state":"read","chars":22603,"kept":2936,"text":"The states and territories are the sub-national constituent entities and the second level of government of Australia. The states are partially-sovereign administrative divisions that function as self-governing polities, having ceded some sovereign rights to the federal government. They have their own constitutions, legislatures, executive governments, judiciaries, law enforcement agencies and emergency services that administer and deliver public policies and programs. Territories can be autonomous and administer policies and programs much like the states in practice, but are still legally subordinate to the federal government. Australia has six federated states: New South Wales, Queensland, South Australia, Tasmania, Victoria, and Western Australia; and two self-governing federal territories: the Australian Capital Territory (ACT) and the Northern Territory. Australia has a total of ten federal territories, which includes three internal territories on the mainland: the aforementioned ACT and Northern Territory as well as the Jervis Bay Territory, which is governed for most purposes by the laws of the ACT and is administered by the Commonwealth Government. The remaining seven federal territories are offshore dependent territories known as external territories: the Ashmore and Cartier Islands, the Australian Antarctic Territory, Christmas Island, the Cocos (Keeling) Islands, the ","note":"kept 2,936 of 22,603 chars","ms":262,"via":     // distinct pages that were read, in the order first read; the last read of each wins for sizes
    const pageList = []; const byUrl = new Map();
    for (const p of D.pages) { if (p.t1 == null || p.t1 > t) continue; if (!byUrl.has(p.url)) { const o = { url: p.url, domain: p.domain, site: p.site, title: p.title, reads: [] }; byUrl.set(p.url, o); pageList.push(o); } byUrl.get(p.url).reads.push(p); }
    for (const pg of pageList) { const ok = pg.reads.filter((r) => r.state === "read"); pg.read = ok[ok.length - 1] || null; pg.failed = !pg.read; }
    const quick = D.quick.map((q, i) => ({ ...q, full: (D.handed[i] && String(D.handed[i].text || "").slice(0, 40) === String(q.text || "").slice(0, 40)) ? D.handed[i].text : q.text })).filter((q) => q.at <= t);
    const citedAll = done ? D.cited : [];
    const readPages = pageList.filter((p) => p.read);
    const usedPages = new Set(quick.map((q) => q.url));

    /* ---------------- FIGURE ---------------- */
    const groups = readPages.filter((p) => usedPages.has(p.url) || citedAll.some((c) => c.url === p.url)).map((pg) => {
      const qs = quick.filter((q) => q.url === pg.url);
      const cs = citedAll.filter((c) => c.url === pg.url);
      const clip = (txt, tagText, key, full) => {
        const open = OPENG.has(key);
        return h("figure", { class: "clip", style: paper(pg.domain) },
          h("figcaption", { class: "ct" }, tagText),
          h("button", { type: "button", class: "cb", "aria-expanded": String(open), onclick: () => { open ? OPENG.delete(key) : OPENG.add(key); api.go("figure", true); }, style: `font-size:${typeOf(pg.domain).bodySize || "15px"}` },
            h("span", { class: open ? "" : "clamp" }, open ? full : txt)));
      };
      const items = [
        ...cs.map((c) => h("figure", { class: "clip cited", style: paper(pg.domain) }, h("figcaption", { class: "ct" }, `the sentence the answer rests on · ${c.n}`), h("p", { class: "cb2", style: `font-size:${typeOf(pg.domain).bodySize || "15px"}` }, c.before ? c.before + " " : "", h("strong", null, c.mark), c.after ? " " + c.after : ""))),
        ...qs.map((q, i) => clip(q.text, `lap ${q.lap} · passage ${q.n} of ${q.of}`, pg.url + "#" + q.at, q.full)),
      ];
      return h("section", { class: "pg" },
        h("header", { class: "ph" }, h("span", { class: "who" }, fav(D, pg.domain, pg.site), h("b", null, pg.domain)), h("span", { class: "pt" }, pageTitle(pg.title)), h("span", { class: "pm mono" }, `kept ${fmt(pg.read.kept)} of ${fmt(pg.read.chars)} characters`)),
        h("div", { class: "clips" }, items));
    });
    const quiet = pageList.filter((p) => !groups.length || !(usedPages.has(p.url) || citedAll.some((c) => c.url === p.url)));
    const quietRows = quiet.map((p) => h("li", null, fav(D, p.domain, p.site), h("span", null, h("b", null, p.domain), " ", p.failed ? (p.reads[p.reads.length - 1].note || "no text came back") : `kept ${fmt(p.read.kept)} characters; none handed on`)));
    const figure = h("div", { class: "ins" },
      h("p", { class: "ftitle" }, h("b", null, "What it kept, in each page’s own words and type."), " Tap a passage to see the rest of what the record holds of it."),
      groups.length ? groups : h("p", { class: "gap" }, "No passage has been chosen yet at this moment of the tape."),
      quiet.length ? h("div", { class: "quiet" }, h("p", { class: "kick" }, "Pages that gave nothing to the writer"), h("ul", null, quietRows)) : null);

    /* ---------------- GROUND ---------------- */
    const maxChars = Math.max(1, ...readPages.map((p) => p.read.chars || 0));
    if (!OPENG.size && !OPENG.has("init")) { OPENG.add("init"); const c0 = D.cited[0]; if (c0) OPENG.add("g:" + c0.url); else if (readPages[0]) OPENG.add("g:" + readPages[0].url); }
    const rows = readPages.map((pg) => {
      const r = pg.read; const key = "g:" + pg.url; const open = OPENG.has(key);
      const c = citedAll.find((x) => x.url === pg.url) || (D.cited.find((x) => x.url === pg.url) && done ? D.cited.find((x) => x.url === pg.url) : null);
      const pct = r.chars ? Math.round((r.kept / r.chars) * 100) : 0;
      const ty = typeOf(pg.domain);
      let more = null;
      if (open) {
        const stored = (r.text || "");
        more = h("div", { class: "gmore" },
          c && c.keptLen ? h("div", { class: "loupe" },
            h("div", { class: "lp", "aria-hidden": "true", style: `clip-path:polygon(0 0,${Math.max((r.kept / maxChars) * 100, 0.5)}% 0,100% 100%,0 100%)` }),
            h("div", { class: "ktrack" }, h("i", { class: "ktick", style: `left:${(c.span.start / c.keptLen) * 100}%;width:${Math.max(((c.span.end - c.span.start) / c.keptLen) * 100, 0.8)}%` })),
            h("p", { class: "mono cap2" }, `kept text: ${fmt(c.keptLen)} characters. The cited sentence sits at ${fmt(c.span.start)}–${fmt(c.span.end)} of it. Where the kept text sits in the page is not recorded.`)) : null,
          h("div", { class: "pap", style: paper(pg.domain) },
            h("p", { class: "pt2", style: `font-family:${ty.title || "inherit"};font-weight:${ty.titleWeight || 400};text-transform:${ty.titleCase || "none"};letter-spacing:${ty.titleTrack || 0}` }, pageTitle(pg.title)),
            h("div", { class: "scroll", tabindex: "0", role: "region", "aria-label": "Stored text of the page" }, h("p", { style: `font-size:${ty.bodySize || "15px"}` }, stored || "(nothing stored)")),
            h("p", { class: "torn" }, `… ${fmt(Math.max((r.chars || 0) - stored.length, 0))} more characters of this page are not stored on the tape (it keeps the first ${fmt(stored.length)}).`)));
      }
      return h("li", { class: "grow" },
        h("button", { type: "button", class: "gh", "aria-expanded": String(open), onclick: () => { open ? OPENG.delete(key) : OPENG.add(key); api.go("ground", true); } },
          h("span", { class: "who" }, fav(D, pg.domain, pg.site), h("b", null, pg.domain), h("span", { class: "ttl" }, pageTitle(pg.title))),
          h("span", { class: "out" }, `kept ${fmt(r.kept)} of ${fmt(r.chars)} · ${pct}%`)),
        h("div", { class: "rul", "aria-hidden": "true" }, h("i", { class: "pagebar", style: `width:${(r.chars / maxChars) * 100}%` }, h("i", { class: "keptbar", style: `width:${r.chars ? (r.kept / r.chars) * 100 : 0}%` }))),
        more);
    });
    const pcts = readPages.map((p) => (p.read.chars ? p.read.kept / p.read.chars : 0)).sort((a, b) => a - b);
    const med = pcts.length ? Math.round(pcts[Math.floor(pcts.length / 2)] * 100) : 0;
    const failedPages = pageList.filter((p) => p.failed);
    const ground = h("div", { class: "ins" },
      h("p", { class: "ftitle" }, h("b", null, `${plural(readPages.length, "page")} read; most of each was left behind.`), " Each bar is a whole page; the filled part is how much was kept. Sizes only: where in the page is not recorded. Tap a page to open it."),
      h("ul", { class: "grows" }, rows),
      failedPages.length ? h("p", { class: "mut tl" }, `${plural(failedPages.length, "page")} could not be opened and are not drawn: ${failedPages.map((p) => p.domain).join(", ")}.`) : null);

    /* ---------------- PATTERN ---------------- */
    const RC = D.recur;
    const cols = RC.pages;
    const dot = (inn, u) => h("span", { class: "dot " + (inn.includes(u) ? "y" : "n"), "aria-label": inn.includes(u) ? "present" : "absent" }, inn.includes(u) ? "●" : "·");
    const row = (txt, inn, mono) => h("li", { class: "crow" }, h("span", { class: "ctx" + (mono ? " mono" : "") }, mono ? txt : "“" + txt + "”", h("em", { class: "cn" }, ` ${inn.length} of ${cols.length} pages`)), h("span", { class: "dcols" }, cols.map((c) => dot(inn, c.url))));
    const head = h("div", { class: "chead" }, h("span"), h("span", { class: "dcols" }, cols.map((c) => fav(D, c.domain, c.domain, "sm"))));
    const legend = h("p", { class: "legend2" }, cols.map((c) => h("span", null, fav(D, c.domain, c.domain, "sm"), c.domain)));
    const pattern = h("div", { class: "ins" },
      h("p", { class: "ftitle" }, h("b", null, RC.runs.length || RC.figures.length ? "What more than one page says in the same words." : "No wording recurs between these pages."), " Found by comparing the passages the record keeps. Each dot is a page that has it."),
      RC.runs.length ? [h("p", { class: "kick" }, "Runs of words"), head, h("ul", { class: "crows" }, RC.runs.map((r) => row(r.text, r.in)))] : null,
      RC.figures.length ? [h("p", { class: "kick", style: "margin-top:18px" }, "Figures"), h("ul", { class: "crows" }, RC.figures.map((r) => row(r.text, r.in, true)))] : null,
      legend);
    return {
      caption: `Kept ${plural(quick.length, "passage")} from ${plural(new Set(quick.map((q) => q.url)).size, "page")}${citedAll.length ? ` · ${plural(citedAll.length, "sentence")} cited` : ""}`,
      ground, figure, pattern,
      hints: {
        figure: `${plural(D.quick.length, "passage")} from ${plural(new Set(D.quick.map((q) => q.url)).size, "page")}${D.cited.length ? ", " + D.cited.length + " cited" : ", none cited"}`,
        ground: `${plural(readPages.length, "page")} read; a median ${med}% of each was kept`,
        pattern: `${plural(RC.runs.length, "phrase")} and ${plural(RC.figures.length, "figure")} on more than one page`,
      },
    };
  },
};

/* Shared runtime for the three Existence mocks: dataset, theme, recorded-time scrubber, and the three grain faces
   (Ground / Figure / Pattern). A stage supplies STAGE = { code, glyph, domain, faces:{ground,figure,pattern}:{name,terrain,stance}, render(D,t,api) }. */
const DATA = JSON.parse(document.getElementById("data").textContent);
const FACES = ["ground", "figure", "pattern"];
const WHEEL = { ground: "Void · the hub", figure: "Beings · the spokes", pattern: "Fold · the rim" };
function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  if (a) for (const [k, v] of Object.entries(a)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const fmt = (n) => (n == null ? "" : Number(n).toLocaleString("en"));
const secs = (s) => (s < 0.05 ? "<0.1" : s < 10 ? s.toFixed(1) : String(Math.round(s))) + " s";
const plural = (n, w, ws) => `${fmt(n)} ${n === 1 ? w : ws || w + "s"}`;
function fav(D, domain, site, cls) {
  const ty = D.types[domain] || {};
  return h("span", { class: "fav " + (cls || ""), "aria-hidden": "true", style: `background:${ty.favBg || "#f1f1f4"};color:${ty.favFg || "#44444e"}` }, ty.fav || String(site || domain || "?").charAt(0).toUpperCase());
}
const hollowFav = (cls) => h("span", { class: "fav hollow " + (cls || ""), "aria-hidden": "true" }, "?");
const pageTitle = (t) => String(t || "").replace(/ - (Wikipedia|National Geographic Society)$/, "");
const siteName = (p) => p.domain || p.site || "";

const S = { d: 0, face: "figure", t: null, theme: "auto", prevFace: null };
(function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  const di = DATA.findIndex((x) => x.id === q.get("d"));
  if (di >= 0) S.d = di;
  if (FACES.includes(q.get("f"))) S.face = q.get("f");
  if (q.get("t") != null && q.get("t") !== "") S.t = Number(q.get("t"));
  if (["light", "dark", "auto"].includes(q.get("theme"))) S.theme = q.get("theme");
})();
function writeHash() {
  const q = new URLSearchParams();
  q.set("d", DATA[S.d].id); q.set("f", S.face); if (S.t != null) q.set("t", String(S.t)); if (S.theme !== "auto") q.set("theme", S.theme);
  history.replaceState(null, "", "#" + q.toString());
}
function applyTheme() { if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme); }

const $faces = document.getElementById("faces");
const $cap = document.getElementById("cap");
const $crumbs = document.getElementById("crumbs");
const $hl = document.getElementById("hl");
const $hr = document.getElementById("hr");
let lastRender = null;

function go(face, instant) {
  if (!FACES.includes(face) || face === S.face && !instant) return;
  S.prevFace = S.face; S.face = face; writeHash(); paint(true);
  const f = document.getElementById("f-" + face); if (f) { f.setAttribute("tabindex", "-1"); f.focus({ preventScroll: true }); }
}
function step(dir) { const i = FACES.indexOf(S.face) + dir; if (i >= 0 && i < FACES.length) go(FACES[i]); }

function paint(animate) {
  const D = DATA[S.d];
  const t = S.t == null ? D.dur : Math.min(S.t, D.dur);
  const api = { go, S, t };
  const R = STAGE.render(D, t, api);
  lastRender = R;
  $cap.textContent = R.caption;
  const F = STAGE.faces;
  $crumbs.replaceChildren(
    h("span", null, "Reading"), h("span", { class: "sep" }, "›"),
    h("button", { type: "button", onclick: () => go("figure"), "aria-label": `Stage ${STAGE.n}, ${STAGE.code}: back to the figure face` }, `${STAGE.n} · ${STAGE.code} ${STAGE.glyph}`),
    h("span", { class: "sep" }, "›"), h("b", { "aria-current": "page" }, `${cap(S.face)}: ${F[S.face].terrain} · ${F[S.face].stance}`),
    h("span", { class: "dots", "aria-hidden": "true", style: "margin-left:auto;padding:0" }, FACES.flatMap((f, i) => [i ? h("span") : null, h("i", { class: f === S.face ? "on" : "" })]))
  );
  $faces.setAttribute("aria-label", `${STAGE.code}, ${cap(S.face)} face: ${F[S.face].terrain} ${F[S.face].stance}`);
  for (const f of FACES) {
    let node = document.getElementById("f-" + f);
    if (!node) { node = h("section", { class: "face", id: "f-" + f, "aria-label": `${cap(f)}: ${F[f].terrain} · ${F[f].stance}` }); $faces.append(node); }
    const active = f === S.face;
    node.hidden = !active; if (!active) { node.setAttribute("inert", ""); } else node.removeAttribute("inert");
    if (active) {
      node.replaceChildren(R[f]);
      node.classList.remove("in-zoomin", "in-zoomout", "in-pan");
      if (animate && S.prevFace) {
        const from = FACES.indexOf(S.prevFace), to = FACES.indexOf(f);
        void node.offsetWidth;
        node.classList.add(f === "figure" ? (from === 0 ? "in-zoomin" : "in-pan") : f === "ground" ? "in-zoomout" : "in-pan");
      }
    }
  }
  const i = FACES.indexOf(S.face);
  const L = FACES[i - 1], Rr = FACES[i + 1];
  fillHint($hl, L, R.hints && R.hints[L], "◂");
  fillHint($hr, Rr, R.hints && R.hints[Rr], "▸");
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function fillHint(btn, face, say, arrow) {
  btn.replaceChildren();
  if (!face) { btn.disabled = true; btn.setAttribute("aria-hidden", "true"); btn.style.visibility = "hidden"; return; }
  btn.disabled = false; btn.removeAttribute("aria-hidden"); btn.style.visibility = "";
  const F = STAGE.faces[face];
  btn.append(
    h("span", { class: "kick" }, arrow === "◂" ? `◂ ${cap(face)} · ${F.terrain}` : `${cap(face)} · ${F.terrain} ▸`),
    h("span", { class: "say" }, say || "")
  );
  btn.setAttribute("aria-label", `${cap(face)} face, ${F.terrain} ${F.stance}. ${say || ""}`);
  btn.onclick = () => go(face);
}

// the mock-only strip
(function mockBar() {
  const row = document.getElementById("mockrow");
  const dset = h("span", { class: "seg", role: "group", "aria-label": "Real turn" }, DATA.map((x, i) => h("button", { type: "button", "aria-pressed": String(i === S.d), onclick: () => { S.d = i; writeHash(); syncBar(); paint(); } }, x.label)));
  const themes = h("span", { class: "seg", role: "group", "aria-label": "Theme" }, ["auto", "light", "dark"].map((k) => h("button", { type: "button", "data-th": k, "aria-pressed": String(S.theme === k), onclick: () => { S.theme = k; applyTheme(); writeHash(); syncBar(); } }, k)));
  const scrub = h("input", { type: "range", min: "0", max: "100", step: "0.1", id: "scrub", "aria-label": "Recorded time" });
  const out = h("output", { id: "tout" }, "");
  const play = h("button", { type: "button", class: "seg", style: "padding:4px 10px", onclick: () => playIt() }, "▶ play");
  scrub.addEventListener("input", () => { S.t = Number(scrub.value); writeHash(); syncBar(); paint(); });
  row.append(h("span", null, "Real turn: ", dset), h("span", null, "Theme: ", themes), h("label", null, "Recorded time ", scrub, out), play);
  window.syncBar = function () {
    const D = DATA[S.d]; scrub.max = String(Math.ceil(D.dur)); scrub.value = String(S.t == null ? Math.ceil(D.dur) : S.t);
    out.textContent = (S.t == null ? D.dur : Math.min(S.t, D.dur)).toFixed(1) + " s of " + D.dur.toFixed(1) + " s";
    [...dset.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === S.d)));
    [...themes.children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.th === S.theme)));
  };
  let timer = null;
  function playIt() {
    if (timer) { clearInterval(timer); timer = null; return; }
    const D = DATA[S.d]; S.t = 0; const k = D.dur / 14;
    timer = setInterval(() => { S.t = Math.min(D.dur, (S.t || 0) + 0.1 * k); syncBar(); paint(); if (S.t >= D.dur) { clearInterval(timer); timer = null; } }, 100);
  }
})();

// travel: arrow keys and swipes (the hints and the dots are the visible way)
document.addEventListener("keydown", (e) => {
  if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); } else if (e.key === "ArrowRight") { step(1); e.preventDefault(); } else if (e.key === "Escape" && S.face !== "figure") { go("figure"); }
});
(function swipe() {
  let x0 = null, y0 = 0;
  $faces.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") return; x0 = e.clientX; y0 = e.clientY; });
  $faces.addEventListener("pointerup", (e) => { if (x0 == null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null; if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) step(dx < 0 ? 1 : -1); });
})();
applyTheme(); syncBar(); paint(false);

</script>
