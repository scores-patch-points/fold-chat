<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SEG — the sentence, cut</title>
<style>
:root {
  --bg:#ffffff; --side:#ffffff; --side2:#f1f1f4; --line:#e4e4e9; --line2:#cfcfd7; --field-line:#8d8d9a;
  --ink:#141416; --ink2:#44444e; --mut:#5f5f6b;
  --link:#1d4ed8; --on-link:#ffffff; --hl:#fdf0b0;
  --ag:#0d7a70; --ag-soft:#e7f6f3; --ok:#16793a; --bad:#c62828; --warn:#a04a07;
  --shadow:0 8px 28px rgba(20,20,22,.16);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Lato,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:Georgia,'Times New Roman',serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#17171a; --side:#1c1c20; --side2:#29292e; --line:#2e2e33; --line2:#3f3f46; --field-line:#7c7c88;
  --ink:#f4f4f6; --ink2:#c9c9d2; --mut:#9d9da8;
  --link:#8ab4ff; --on-link:#0b1220; --hl:#4d4318;
  --ag:#2dd4bf; --ag-soft:#0f2b27; --ok:#56d364; --bad:#f87171; --warn:#f0b429;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#17171a; --side:#1c1c20; --side2:#29292e; --line:#2e2e33; --line2:#3f3f46; --field-line:#7c7c88;
  --ink:#f4f4f6; --ink2:#c9c9d2; --mut:#9d9da8;
  --link:#8ab4ff; --on-link:#0b1220; --hl:#4d4318;
  --ag:#2dd4bf; --ag-soft:#0f2b27; --ok:#56d364; --bad:#f87171; --warn:#f0b429;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--sans); }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--link); outline-offset:2px; border-radius:6px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.wrap { max-width:1180px; margin:0 auto; padding:0 16px 96px; }

/* header: one line + one caption ------------------------------------------------ */
.top { display:flex; align-items:center; gap:10px; padding:14px 0 4px; flex-wrap:wrap; }
.stg { font:600 12px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--mut); display:flex; gap:8px; align-items:center; }
.stg b { color:var(--ag); font-size:15px; letter-spacing:0; }
.spacer { flex:1; }
.turns { display:flex; gap:4px; }
.turns button, .themebtn { font-size:12.5px; color:var(--ink2); padding:6px 10px; border-radius:999px; border:1px solid var(--line2); min-height:32px; }
.turns button[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.themebtn { min-width:32px; text-align:center; }
.caption { margin:6px 0 14px; font-size:18px; line-height:1.35; font-weight:600; letter-spacing:-.01em; }
.caption small { display:block; font-weight:400; font-size:13px; color:var(--mut); margin-top:2px; letter-spacing:0; }
@media (min-width:760px) { .caption { font-size:22px; } }

/* the three faces: a dial, then a breadcrumb --------------------------------------- */
.dial { display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:1px solid var(--line2); border-radius:12px; overflow:hidden; background:var(--side); }
.dial button { padding:9px 6px 8px; text-align:center; min-height:48px; border-left:1px solid var(--line); display:flex; flex-direction:column; gap:2px; align-items:center; justify-content:center; }
.dial button:first-child { border-left:0; }
.dial .n { font-size:14px; font-weight:600; line-height:1.2; }
.dial .c { font:500 10px/1.2 var(--mono); color:var(--mut); letter-spacing:.04em; text-transform:uppercase; }
.dial button[aria-selected="true"] { background:var(--ink); color:var(--bg); }
.dial button[aria-selected="true"] .c { color:var(--bg); opacity:.85; }
.dial button:focus-visible { outline-offset:-3px; }
.crumbs { list-style:none; margin:8px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:2px 0; font-size:13px; color:var(--mut); min-height:22px; }
.crumbs li { display:flex; align-items:center; }
.crumbs li + li::before { content:"›"; padding:0 7px; color:var(--mut); }
.crumbs button { color:var(--ink2); padding:2px 0; max-width:34ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.crumbs li:last-child button { color:var(--ink); font-weight:600; }
.what { margin:10px 0 0; font-size:13.5px; color:var(--ink2); max-width:70ch; }

/* layout: stage + docked reader ---------------------------------------------------- */
.layout { display:grid; grid-template-columns:minmax(0,1fr); gap:28px; margin-top:14px; align-items:start; }
@media (min-width:1000px) { body.sheet-open .layout { grid-template-columns:minmax(0,1fr) 400px; } }
.stage { min-width:0; }
.stage.flip { animation:flip .22s ease both; }
@keyframes flip { from { opacity:0; transform:scale(.985); } }
@media (prefers-reduced-motion: reduce) { .stage.flip { animation:none; } }

/* favicon ------------------------------------------------------------------------ */
.fav { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:5px; font:700 11px/1 var(--sans); flex:none; border:1px solid var(--line2); vertical-align:middle; }
.fav.sm { width:16px; height:16px; font-size:9.5px; border-radius:4px; }
.dom { font-size:13px; font-weight:600; color:var(--ink); }
.mut { color:var(--mut); }
.mono { font-family:var(--mono); }

/* the reader sheet ------------------------------------------------------------------ */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.42); opacity:0; pointer-events:none; transition:opacity .18s; z-index:40; }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:50; max-height:78vh; background:var(--side); border-top:1px solid var(--line2); border-radius:18px 18px 0 0; box-shadow:var(--shadow); transform:translateY(106%); transition:transform .22s ease; display:flex; flex-direction:column; visibility:hidden; }
body.sheet-open .sheet { transform:none; visibility:visible; }
body.sheet-open .scrim { opacity:1; pointer-events:auto; }
.sheet .grip { width:38px; height:4px; border-radius:2px; background:var(--line2); margin:8px auto 2px; flex:none; }
.sh-h { display:flex; align-items:center; gap:10px; padding:8px 16px 10px; }
.sh-h .t { min-width:0; flex:1; }
.sh-h .t b { display:block; font-size:14px; }
.sh-h .t span { display:block; font-size:12.5px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sh-x { width:36px; height:36px; border-radius:50%; border:1px solid var(--line2); display:grid; place-items:center; font-size:16px; flex:none; }
.sh-body { overflow:auto; padding:2px 16px 8px; flex:1; min-height:0; }
.paper { border-radius:10px; padding:14px 16px; border:1px solid var(--line2); }
.paper p { margin:0; }
.paper .ctx { opacity:.62; font-size:.92em; }
.paper .cur { margin:10px 0; padding:10px 0 10px 12px; border-left:3px solid var(--ag); font-size:1.12em; line-height:1.55; }
.paper .cur b { font-weight:700; }
.paper .gapn { font:11px/1.4 var(--mono); opacity:.7; margin:6px 0; }
.sh-nav { display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid var(--line); }
.sh-nav .pn { min-width:44px; height:40px; padding:0 12px; border:1px solid var(--line2); border-radius:10px; font-size:14px; }
.sh-nav .pn:disabled { color:var(--mut); border-style:dashed; cursor:default; }
.ticks { flex:1; display:flex; align-items:center; gap:2px; height:28px; min-width:0; }
.ticks button { flex:1; max-width:14px; min-width:3px; height:10px; background:var(--line2); border-radius:2px; align-self:center; }
.ticks button.mk { height:18px; background:var(--ink2); }
.ticks button.on { height:26px; background:var(--ag); }
.sh-pos { font:12px/1.3 var(--mono); color:var(--mut); padding:0 16px 6px; }
.sh-f { padding:8px 16px 14px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; border-top:1px solid var(--line); font-size:13px; color:var(--mut); }
.sh-f button, .sh-f a { padding:6px 10px; border:1px solid var(--line2); border-radius:999px; color:var(--ink2); font-size:13px; min-height:32px; display:inline-flex; align-items:center; text-decoration:none; }
.sh-f button[disabled] { background:var(--ink); color:var(--bg); border-color:var(--ink); cursor:default; }
.sh-f .sp { flex:1; }
@media (min-width:1000px) {
  .scrim { display:none; }
  .sheet { position:sticky; top:14px; left:auto; right:auto; bottom:auto; grid-column:2; grid-row:1; max-height:calc(100vh - 28px); border:1px solid var(--line2); border-radius:14px; transform:none; display:none; margin-top:0; }
  body.sheet-open .sheet { display:flex; }
  .sheet .grip { display:none; }
}
.foot { margin-top:34px; font-size:12.5px; color:var(--mut); max-width:72ch; border-top:1px solid var(--line); padding-top:12px; }

/* SEG ｜  the sentence, cut — on the same ruled grid as the app's step 4 ------------------ */
.gridbg { background-color:var(--bg); background-image:linear-gradient(var(--side2) 1px, transparent 1px), linear-gradient(90deg, var(--side2) 1px, transparent 1px); background-size:20px 20px; border-radius:14px; padding:14px 14px 6px; }
.cuts { display:flex; flex-direction:column; gap:6px; }
.cut-row { padding:12px 0 14px; border-top:1px dashed var(--line2); }
.cut-row:first-child { border-top:0; padding-top:2px; }
.cut-row.focus { outline:2px solid var(--ag); outline-offset:6px; border-radius:10px; border-top-color:transparent; }
.cut-h { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.cut-h .src { display:inline-flex; align-items:center; gap:8px; min-height:32px; padding-right:8px; }
.cut-h .pos { font:11.5px/1.3 var(--mono); color:var(--mut); }
.cut-h .fl { font-size:12.5px; color:var(--warn); }
.sent { margin:0; font-size:17px; line-height:2.45; padding-top:6px; color:var(--ink2); overflow-wrap:anywhere; }
@media (min-width:760px) { .sent { font-size:19px; } }
.sent .g { position:relative; display:inline; padding:1px 8px 2px; margin:0 2px; border:1.5px solid var(--line2); border-radius:8px; color:var(--ink); background:var(--bg); -webkit-box-decoration-break:clone; box-decoration-break:clone; transition:border-color .35s ease, background-color .35s ease, color .35s ease; transition-delay:var(--d,0ms); }
.sent .g::before { content:attr(data-role); white-space:nowrap; position:absolute; top:-10px; left:7px; font:600 9.5px/1 var(--mono); letter-spacing:.05em; background:var(--bg); padding:0 4px; transition:opacity .35s ease; transition-delay:var(--d,0ms); }
.sent .g-s { border-color:var(--ag); } .sent .g-s::before { color:var(--ag); }
.sent .g-v { border-color:var(--link); background:var(--link); color:var(--on-link); font-style:italic; } .sent .g-v::before { color:var(--link); }
.sent .g-o { border-color:var(--warn); } .sent .g-o::before { color:var(--warn); }
.sent .g-miss { border-style:dashed; color:var(--mut); } .sent .g-miss::before { opacity:1; }
.sent .g.guess { border-style:dashed; }
.sent .g:hover { border-color:var(--ink); }
.plain .sent .g { border-color:transparent; background:transparent; color:var(--ink2); font-style:normal; }
.plain .sent .g::before { opacity:0; }
.sent .rest { color:var(--mut); }
.why { margin:2px 0 0; font-size:12.5px; color:var(--mut); }
.why b { font-weight:600; color:var(--ink2); }
.nocut { color:var(--mut); font-size:13px; margin:0; }

/* Ground: the kept lines of each page, bar by bar ----------------------------------------- */
.strips { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:22px 18px; }
.strip { display:flex; flex-direction:column; gap:8px; min-width:0; }
.strip .sh { display:flex; gap:8px; align-items:center; min-height:32px; }
.strip .sh .dom { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.meter { height:6px; border-radius:3px; background:repeating-linear-gradient(135deg, var(--line2) 0 3px, transparent 3px 6px); position:relative; overflow:hidden; }
.meter i { position:absolute; inset:0 auto 0 0; background:var(--ink2); border-radius:3px; }
.keptn { font:11.5px/1.35 var(--mono); color:var(--mut); }
.bars { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
.bars li { display:block; }
.bars button { display:block; height:11px; border-radius:3px; background:var(--line2); min-width:14px; }
.bars button:hover { background:var(--mut); }
.bars .joined { border-left:3px solid var(--ag); padding-left:6px; margin-left:-9px; display:flex; flex-direction:column; gap:5px; }
.bars .cutl button { background:var(--ag); }
.bars .cutl button:hover { background:var(--ag); outline:2px solid var(--ink); }
.bars li.focus button { outline:2px solid var(--ink); outline-offset:1px; }
.cap { font-size:13px; line-height:1.4; margin:0; }
.cap b { font:600 10px/1 var(--mono); letter-spacing:.05em; color:var(--ag); display:block; margin-bottom:2px; }
.cap span { color:var(--ink2); }
.legend { margin:18px 0 0; font-size:12.5px; color:var(--mut); display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; }
.legend i { display:inline-block; width:22px; height:9px; border-radius:3px; background:var(--line2); vertical-align:middle; margin-right:6px; }
.legend i.c { background:var(--ag); }

/* Pattern: every cut, lined up on its verb ---------------------------------------------------- */
.sum { margin:0 0 12px; font-size:14px; color:var(--ink2); }
.conc { display:flex; flex-direction:column; }
.ch { display:flex; align-items:baseline; gap:10px; margin:14px 0 4px; font-size:13px; color:var(--mut); }
.ch b { font:600 13px/1 var(--mono); color:var(--link); }
.crow { display:grid; grid-template-columns:22px minmax(0,1fr) auto minmax(0,1.35fr); align-items:center; gap:0 10px; padding:7px 4px; border-top:1px solid var(--line); width:100%; font-size:13px; line-height:1.35; color:var(--ink2); }
.crow.focus { outline:2px solid var(--ag); outline-offset:-2px; border-radius:8px; }
.crow:hover { background:var(--side2); border-radius:8px; }
.crow .l { display:flex; justify-content:flex-end; overflow:hidden; white-space:nowrap; -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 22px); mask-image:linear-gradient(90deg, transparent 0, #000 22px); }
.crow .l span { flex:none; }
.crow .r { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.crow .v { font-style:italic; background:var(--link); color:var(--on-link); border-radius:7px; padding:2px 9px; }
.crow .v.guess { background:transparent; color:var(--link); border:1.5px dashed var(--link); padding:1px 8px; }
@media (min-width:760px) { .crow { grid-template-columns:24px minmax(0,1fr) auto minmax(0,1.6fr); font-size:15px; gap:0 14px; padding:9px 6px; } }

</style>
</head>

<script>window.__DATA__ = [{"id":"wall","label":"Is the Great Wall of China visible from space?","ask":"Is the Great Wall of China visible from space?","answer":["The Great Wall of China is not visible from space.","According to NASA, the wall is not as visible from orbit as modern desert roads."],"sources":[{"id":0,"domain":"skyatnightmagazine.com","site":"skyatnightmagazine.com","title":"Can you see the Great Wall of China from space? - BBC Sky at Night Magazine","url":"https://www.skyatnightmagazine.com/space-science/can-you-see-great-wall-china-from-space","chars":4840,"kept":1636,"via":"the fold's relay","lap":0,"clipped":false,"lines":[{"t":"When it comes to spaceflight and astronomy, many myths abound, one of the biggest being the idea that you can see the Great Wall of China from space.","pid":"p0"},{"t":"The truth is that the Great Wall of China cannot be seen from space.","pid":"p0"},{"t":"In fact, as early as 1754 the famed English scientist and antiquarian Rev. William Stukeley wrote in a private letter about \"the Chinese wall, which makes a considerable figure upon the terrestrial globe, and may be discerned at the Moon.\"","pid":"p0"},{"t":"Perhaps much of the presumption surrounding the Great Wall of China's visibility from the Moon came from 19th century Italian astronomer Giovanni Schiaparelli's observations of Mars, during which he observed what he called \"canali\" (channels).","pid":"p0"},{"t":"Apollo 12 Lunar Module Pilot Alan Bean is quoted as saying: \"The only thing you can see from the Moon is a beautiful sphere, mostly white, some blue and patches of yellow, and every once in a while some green vegetation.","pid":"p0"},{"t":"\"No man-made object is visible at this scale.\"","pid":"p0"},{"t":"Well, on 24 November 2004, an image of the Great Wall of China was captured from low Earth orbit by US astronaut and International Space Station Commander Leroy Chiao.","pid":"p0"},{"t":"The image shows central Inner Mongolia, and the yellow arrow indicates an estimated location of 42.5N 117.4E, where the wall is visible, according to this great NASA webpage on the subject.","pid":"p0"},{"t":"And then there's ESA astronaut Alexander Gerst's photo of the Great Wall of China from space, captured from the International Space Station on 19 June 2018.","pid":"p0"},{"t":"This was confirmed by China's own first astronaut, Yang Liwei, who orbited Earth 14 times in October 2003 during the Chinese space agency's Shenzhou 5 mission.","pid":"p0"},{"t":"Surely, given the International Space Station's position in low-Earth orbit, astronauts living and working onboard the ISS would be the perfect candidates to prove or disprove whether the Great Wall of China can be seen with the naked eye from space.","pid":"p3"},{"t":"This was famously mistranslated into English as \"canals\", leading some English speakers to believe that the Martian structures had been built by an intelligent native populace.","pid":"p3"},{"t":"At the time, Gerst posted on social media: \"I think I finally found the answer to a question I've been asked a 1000 times.","pid":"p3"},{"t":"\"The Earth looked very beautiful from space, but I did not see our Great Wall,\" he said.","pid":"p3"}]},{"id":1,"domain":"checkthisfact.com","site":"checkthisfact.com","title":"Great Wall of China visible from space myth - checkthisfact.com","url":"https://checkthisfact.com/factchecks/the-great-wall-of-china-is-visible-from-space","chars":4922,"kept":795,"via":"the fold's relay","lap":0,"clipped":false,"lines":[{"t":"Great Wall of China visible from space myth","pid":"p1"},{"t":"“The Great Wall of China is visible from space.”","pid":"p1"},{"t":"The Great Wall of China and Inner Mongolia are featured in this image photographed by Expedition 10 Commander Leroy Chiao on the International Space Station.","pid":"p1"},{"t":"Is it Really Possible to See the Great Wall of China from Space ...Checking your browser before accessing pmc.ncbi.nlm.nih.gov · Click here if you are not automatically redirected after 5 seconds","pid":"p1"},{"t":"| Scientific AmericanThough it stretches for some 4,500 miles, the ancient Chinese fortification is not as visible from orbit as modern desert roads","pid":"p1"},{"t":"Credit: NASA · The image shows central Inner Mongolia, and the yellow arrow indicates an estimated location of 42.5N 117.4E, where the wall is visible, according to this great NASA webpage on the subject.","pid":"p1"},{"t":"The Great Wall of China is not visible to the naked eye from space, even in low-earth orbit, according to NASA.","pid":"p4"}]},{"id":2,"domain":"halleyspace.com","site":"halleyspace.com","title":"No, the Great Wall of China is not visible from space","url":"https://www.halleyspace.com/great-wall-of-china-visible-from-space-myth/","chars":5966,"kept":1537,"via":"the fold's relay","lap":0,"clipped":false,"lines":[{"t":"No, the Great Wall of China is not visible from space","pid":"p2"},{"t":"At 400 kilometers up, the Great Wall is roughly ten times too narrow for the human eye to resolve, and its color barely stands out from the ground around it.","pid":"p2"},{"t":"The idea resurfaced in 1938 in Richard Halliburton's bestselling Second Book of Marvels, which stated flatly that \"astronomers say\" the wall was the only human made object visible from the Moon, without naming a single astronomer.","pid":"p2"},{"t":"Apollo 11's Neil Armstrong said the wall is \"definitely not visible from the Moon\" to the naked eye.","pid":"p2"},{"t":"China's first taikonaut, Yang Liwei, told reporters in October 2003 that \"the Earth looked very beautiful from space, but I did not see our Great Wall,\" as reported by BBC Sky at Night Magazine.","pid":"p2"},{"t":"One arcminute is 1/60 of a degree, or about 2.9 x 10⁻⁴ radians.","pid":"p2"},{"t":"The Great Wall's widest sections run about 9 to 10 meters across.","pid":"p2"},{"t":"The International Space Station orbits roughly 400 kilometers, 400,000 meters, above the ground.","pid":"p2"},{"t":"The Great Wall itself is photographable, astronaut Leroy Chiao captured it from the ISS in 2004, but only with a telephoto lens, the same kind of equipment that turns an indistinct smear into a resolvable structure precisely because a lens can gather and magnify light in a way the naked eye cannot.","pid":"p2"},{"t":"No. At the Moon's distance, about 384,000 kilometers, the wall's angular size shrinks to a small fraction of what it is from low Earth orbit, making it far less visible than it already isn't from the ISS.","pid":"p2"},{"t":"The earliest trace is a 1754 letter by English antiquarian William Stukeley.","pid":"p2"},{"t":"\"The human eye is most sensitive to contrast, and the color of the wall is not that different from the ground on either side of it,\" he told Scientific American.","pid":"p5"},{"t":"Much of the wall is rammed earth and local stone, the same tan and gray palette as the terrain it crosses.","pid":"p5"},{"t":"The wall would need to be more than ten times wider than its actual 9 to 10 meters before an unaided eye in orbit could resolve it as a line at all, and that is before accounting for Hoffman's point about weak contrast, which makes the effective threshold even worse.","pid":"p5"},{"t":"At about 400 kilometers up the wall is roughly ten times narrower than human vision can resolve, and photographs of it from orbit have all required telephoto lenses.","pid":"p5"},{"t":"Is the Great Wall visible from the Moon?","pid":"p5"},{"t":"NASA, image article on the Great Wall of China photographed from the ISS","pid":"p5"}]},{"id":3,"domain":"chinahighlights.com","site":"chinahighlights.com","title":"Can the Great Wall Be Seen from Space? — It Depends! - China Highlights","url":"https://www.chinahighlights.com/greatwall/great-wall-from-space.htm","chars":4177,"kept":1057,"via":"direct","lap":0,"clipped":false,"lines":[{"t":"The Great Wall we see from Earth might be very magnificent, but it is only just possible for the naked eye to see it from outer space (100 km upwards).","pid":"p6"},{"t":"Experts now say that only someone with sharp eyes in a low earth orbit (160 km above Earth) can pick out certain sections of the wall in excellent viewing conditions if they know exactly where it is.","pid":"p6"},{"t":"However, it is much easier to see other constructions, such as highways or canals, such as the Grand Canal, since they stand out more clearly.","pid":"p6"},{"t":"The sun was at the right angle to cast a long shadow, and experts said the Great Wall was visible in the picture.","pid":"p6"},{"t":"Leroy Chiao confirmed that the Great Wall can only be photographed from space in very good viewing conditions from a lower earth orbit by someone who is quite familiar with the geographic position of the Great Wall.","pid":"p6"},{"t":"The second person to walk on the moon, Buzz Aldrin, made the first lunar landing with commander Neil Armstrong on July 20, 1969.","pid":"p6"},{"t":"When asked whether he could see the Great Wall from space or not, he said he didn't see it— it was a great misunderstanding [that the Great Wall could be seen from the moon].","pid":"p6"},{"t":"3-Day Jiankou to Jinshanling Great Wall Hiking Discovery Tour","pid":"p6"},{"t":"5-Day Badaling to Huangyaguan Great Wall Hiking Tour","pid":"p6"},{"t":"The Original Wall Is Getting Harder to See from Space","pid":"p6"}]},{"id":4,"domain":"greatwalltravelguide.com","site":"greatwalltravelguide.com","title":"Can You See the Great Wall from Space or the Moon? NASA Myth Answer","url":"https://greatwalltravelguide.com/can-you-see-the-great-wall-of-china-from-space/","chars":6313,"kept":263,"via":"the fold's relay","lap":0,"clipped":false,"lines":[{"t":"The NASA Earth Science and Remote Sensing FAQ also explains that the wall is not visible to the naked eye from orbit in the way the myth suggests.","pid":"p7"},{"t":"Cameras and special conditions can produce images, but that is not the same as the popular myth.","pid":"p7"},{"t":"Cities, roads, airports, fields, re ia":"direct","lap":0,"clipped":false,"lines":[{"t":"This history of the telephone chronicles the development of the electrical telephone, and includes a brief overview of its predecessors.","pid":"p2"},{"t":"The first telephone patent was granted to Alexander Graham Bell in 1876.","pid":"p2"},{"t":"The Elisha Gray and Alexander Bell telephone controversy considers the question of whether Bell and Gray invented the telephone independently and, if not, whether Bell stole the invention from Gray.","pid":"p2"},{"t":"This controversy is narrower than the broader question of who deserves credit for inventing the telephone, for which there are several claimants.","pid":"p2"},{"t":"On 3 November 1877, Coy applied for and received a franchise from the Bell Telephone Company for New Haven and Middlesex Counties.","pid":"p2"},{"t":"Coy, along with Herrick P. Frost and Walter Lewis, who provided the capital, established the District Telephone Company of New Haven on 15 January 1878.","pid":"p2"},{"t":"The District Telephone Company of New Haven went into operation with only twenty-one subscribers, who paid $1.50 per month.","pid":"p2"},{"t":"By 21 February 1878, however, when the first telephone directory was published by the company, fifty subscribers were listed.","pid":"p2"},{"t":"By 1880, the company had the right from the Bell Telephone Company to service all of Connecticut and western Massachusetts.","pid":"p2"},{"t":"As it expanded, the company was first renamed Connecticut Telephone, and then Southern New England Telephone in 1882.","pid":"p2"},{"t":"The site of the first telephone exchange was granted a designation as a National Historic Landmark on 23 April 1965.","pid":"p2"},{"t":"Early 7th century AD - Chimu culture in Peru invents a string telephone using gourds and stretched hide.","pid":"p2"},{"t":"1667: Robert Hooke invents a string telephone that conveys sounds over an extended wire by mechanical vibrations.","pid":"p2"},{"t":"1844: Innocenzo Manzetti first moots the idea of a \"speaking telegraph\" (telephone).","pid":"p2"},{"t":"1849: Antonio Meucci developed a voice-communication apparatus that several sources credit as the first telephone.","pid":"p2"},{"t":"1854: Charles Bourseul writes a memorandum on the principles of the telephone.","pid":"p2"},{"t":"1861: Philipp Reis constructs the first speech-transmitting telephone","pid":"p2"},{"t":"20 January 1876: Bell signs and notarizes his patent application for the telephone.","pid":"p2"},{"t":"patent No. 174,465 for the telephone is granted.","pid":"p2"},{"t":"10 August 1876: Using the telegraph line between Brantford and Paris, Ontario, eight miles (thirteen kilometres) distant, Bell makes a telephone call, said by some to be the \"world's first long-distance call\".","pid":"p2"},{"t":"1877: First long-distance telephone line","pid":"p2"}]}],"failed":[{"url":"https://www.loc.gov/everyday-mysteries/categories/technology/item/who-is-credited-with-inventing-the-telephone","domain":"loc.gov"}],"cuts":[{"src":0,"line":1,"lineEnd":1,"sentence":"Who is credited as the inventor of the telephone?","toks":["Who","is","credited","as","the","inventor","of","the","telephone?"],"roles":["f","v","v","f","f","o","f","f","o"],"tags":["pron","aux","verb","prep","det","word","prep","det","word"],"groups":[{"role":"v","i0":1,"i1":2},{"role":"o","i0":5,"i1":8}],"flags":{"q":true,"glued":false,"verbGuess":false,"capped":false,"capTail":false},"hits":["inventor","telephone"],"lang":"English","nLines":2},{"src":1,"line":0,"lineEnd":0,"sentence":"While credit is typically awarded to Alexander Graham Bell (see main image) and his US patent in 1876, does the famous inventor deserve all the credit when it comes to who invented the telephone?","toks":["While","credit","is","typically","awarded","to","Alexander","Graham","Bell","(see","main","image)","and","his","US","patent","in","1876,","does","the","famous","inventor","deserve","all","the","credit"],"roles":["s","s","v","o","o","f","o","o","o", far the tallest human-made structure in the world, a title it held for 41 years until the Chrysler Building in New York City was finished in 1930.","pid":"p0"},{"t":"Due to the addition of a broadcasting aerial at the top of the tower in 1957, it is now taller than the Chrysler Building by 11 metres (36 ft).","pid":"p0"},{"t":"The top level's upper platform is 276 m (906 ft) above the ground—the highest public observation deck in the European Union.","pid":"p0"},{"t":"Eiffel was to receive all income from the commercial exploitation of the tower during the exhibition and for the next 20 years.","pid":"p0"},{"t":"Prior to the Eiffel Tower's construction, no structure had ever been constructed to a height of 300 m, or even 200 m for that matter, and many people believed it was impossible.","pid":"p0"},{"t":"A petition called \"Artists against the Eiffel Tower\" was sent to the Minister of Works and Commissioner for the Exposition, Adolphe Alphand, and it was published by Le Temps on 14 February 1887:","pid":"p0"},{"t":"The main structural work was completed at the end of March 1889 and, on 31 March, Eiffel celebrated by leading a group of government officials, accompanied by representatives of the press, to the top of the tower.","pid":"p0"},{"t":"At 2:35 pm, Eiffel hoisted a large Tricolour to the accompaniment of a 25-gun salute fired at the first level.","pid":"p0"},{"t":"Edison signed the guestbook with this message on September 10, 1889: To M Eiffel the Engineer the brave builder of so gigantic and original specimen of modern Engineering from one who has the greatest respect and admiration for all Engineers including the Great Engineer the Bon Dieu, Thomas Edison.","pid":"p0"},{"t":"Originally commissioned as a temporary structure for the 1889 Exposition Universelle, Eiffel was slated for dismantling in 1909, at which point ownership would have reverted to the Ci","pid":"p0"},{"t":"It was the first structure in the world to surpass both the 200-metre and 300-metre mark in height.","pid":"p3"},{"t":"Excluding transmitters, the Eiffel Tower is the second tallest free-standing structure in France after the Millau Viaduct.","pid":"p3"},{"t":"Although there is a staircase to the top level, it is usually accessible only by lift.","pid":"p3"}]},{"id":1,"domain":"worldatlas.com","site":"worldatlas.com","title":"How Tall Is the Eiffel Tower? - WorldAtlas","url":"https://www.worldatlas.com/articles/how-tall-is-the-eiffel-tower.html","chars":2784,"kept":2784,"via":"the fold's relay","lap":0,"clipped":false,"lines":[{"t":"The Eiffel Tower in Paris, France was designed by engineer and architect Gustave Eiffel. In French, the Eiffel Tower is referred to as either \"La dame de fer,\" which means \"the iron lady,\" or La Tour Eiffel. Completed in March 1889, the tower was intended to serve as an entrance arch to the 1889 World Fair, which also marked 100 years since the French Revolution. The Eiffel Tower is made from wrought iron and is located on the Champ de Mars. Today, the tower is an iconic symbol of Paris and France. Furthermore, the Eiffel Tower is also one of the most recognized structures in the world and a popular tourist attraction.","pid":"p1"},{"t":"The main structure of the is Eiffel Tower is 300 meters tall, although the height including antennas is 324 meters. This height is roughly equivalent to that of an 81-storey building. Interestingly, the Eiffel Tower can shrink by 6 inches during cold temperatures. The tower has a square base that measures 125 meters by 125 meters. The Eiffel Tower has three levels, and visitors can access the first and second levels by either lifts (elevators) or stairs. There are 1,665 steps to the top of the tower. However, the third level can be accessed only by lifts. The tower has a total of eight lifts. The wrought iron structure of the Eiffel Tower is made up of 18,000 metallic parts and is held together by 2.5 million rivets. As such, the tower is heavy and weighs approximately 10,100 tonnes.","pid":"p1"},{"t":"The Eiffel Tower surpassed the Washington Monument as the tallest man-made structure in the world. It remained the tallest structure until the Chrysler Building was built in New York City in 1930. However, the addition of broadcasting antennas on the top of the tower in 1957 meant that the Eiffel Tower was taller than the Chrysler building by 5.2 meters. The Eiffel Tower was the tallest structure in France, but became the second tallest in the country after the completion of the Millau Viaduct (343 meters tall) in 2004. It is also the most visited paid monument in the world. In fact, an estimated 200 million people have visited the Eiffel Tower since its inauguration.","pid":"p1"},{"t":"The Eiffel Tower was planned to remain in place for a period of 20 years and then be removed. However, it served as an effective communication tower, and therefore was not dismantled, and has now existed for over 125 years. The Eiffel Tower has inspired many other towers around the world, such as the","pid":"p1"},{"t":"The main structure of the is Eiffel Tower is 300 meters tall, although the height including antennas is 324 meters.","pid":"p4"},{"t":"This height is roughly equivalent to that of an 81-storey building.","pid":"p4"},{"t":"The wrought iron structure of the Eiffel Tower is made up of 18,000 metallic parts and is held together by 2.5 million rivets.","pid":"p4"},{"t":"As such, the tower is heavy and weighs approximately 10,100 tonnes.","pid":"p4"},{"t":"However, the addition of broadcasting antennas on the top of the tower in 1957 meant that the Eiffel Tower was taller than the Chrysler building by 5.2 meters.","pid":"p4"},{"t":"The Eiffel Tower was the tallest structure in France, but became the second tallest in the country after the completion of the Millau Viaduct (343 meters tall) in 2004.","pid":"p4"}]},{"id":2,"domain":"eiffel-tower.tours","site":"eiffel-tower.tours","title":"How Tall Is the Eiffel Tower? Height, Floors & Steps","url":"https://eiffel-tower.tours/blog/how-tall-is-the-eiffel-tower/","chars":13026,"kept":1187,"via":"the fold's relay","lap":0,"clipped":false,"lines":[{"t":"How Tall Is the Eiffel Tower?","pid":"p2"},{"t":"The Eiffel Tower is 330 meters, or 1,083 feet, tall from the ground to the tip of its current antenna.","pid":"p2"},{"t":"You may also see the tower described as 300 meters, 312 meters, 320 meters, or 324 meters tall.","pid":"p2"},{"t":"300 meters / 984 feet: the original iron tower, not counting anything mounted above it.","pid":"p2"},{"t":"At 187 feet, it is already high enough to clear most buildings around the Champ de Mars.","pid":"p2"},{"t":"The official Eiffel Tower website describes this level as being around 381 feet high, depending on the exact point measured.","pid":"p2"},{"t":"The rounded figure usually used in visitor guides is 115 meters, or 377 feet.","pid":"p2"},{"t":"It does not have 81 conventional stories inside it, even though 330 meters is roughly the height of an 80-story building.","pid":"p2"},{"t":"How long does it take to climb 674 steps?","pid":"p2"},{"t":"The Eiffel Tower was astonishingly tall in 1889.","pid":"p2"},{"t":"Statue of Liberty, ground to torch --> 93 meters / 305 feet --> Eiffel Tower is about 3.5 times taller","pid":"p2"},{"t":"Washington Monument --> 169 meters / 555 feet --> Eiffel Tower is almost twice as tall","pid":"p2"},{"t":"Chrysler Building --> 319 meters / 1,046 feet --> Eiffel Tower's current antenna tip is 11 meters taller","pid":"p2"},{"t":"Its iron architecture is 300 meters tall, and its public summit is 276 meters high.","pid":"p2"},{"t":"Summit observation level --> 276 meters / 906 feet","pid":"p5"},{"t":"Iron structure --> 300 meters / 984 feet","pid":"p5"},{"t":"312 meters / 1,024 feet: its height at the 1889 opening, including the original flagpole.","pid":"p5"},{"t":"324 meters / 1,063 feet: the widely quoted total after an earlier antenna installation.","pid":"p5"},{"t":"Most of its height is open structure.","pid":"p5"},{"t":"Ground to first floor: about 57 meters / 187 feet","pid":"p5"},{"t":"Gustave Eiffel's team proposed jumping straight to 300 meters with a structure made from more than 18,000 prefabricated iron parts joined by around 2.5 million rivets.","pid":"p5"}]},{"id":3,"domain":"geographyworlds.com","site":"geographyworlds.com","title":"Eiffel Tower Height: 330 Meters Tall | History, Dimensions & Guide ...","url":"https://geographyworlds.com/blog/eiffel-tower-paris-landmark-guide/","chars":8872,"kept":2072,"via":"direct","lap":0,"clipped":false,"lines":[{"t":"Standing 330 meters tall, the Eiffel Tower was built in 1889 for the World's Fair and was meant to be temporary.","pid":"p6"},{"t":"Instead, it became the most recognizable structure on Earth, welcoming nearly 7 million visitors every year.","pid":"p6"},{"t":"The Eiffel Tower stands 330 m (1,083 ft) to the tip of its antenna, on the Champ de Mars in Paris.","pid":"p6"},{"t":"It was built between 1887 and 1889 as the entrance arch to the World's Fair marking the centenary of the French Revolution, reached 300 m without its later aerials, and held the record as the tallest structure on Earth for 41 years until the Chrysler Building passed it in 1930.","pid":"p6"},{"t":"It is no longer the tallest structure in France — the tallest mast of the Millau Viaduct reaches 343 m — and it has not been the tallest in the Paris region since the Tour First at La Defense, though it remains the tallest structure inside the city proper.","pid":"p6"},{"t":"One consequence of building in iron is that the height is not constant.","pid":"p6"},{"t":"The tower was designed at a time when no structure had ever been built anywhere near 300 m, and wind, not weight, was the governing problem.","pid":"p6"},{"t":"In 1909 ownership was due to revert to the City of Paris, which had every intention of taking it down and selling the iron.","pid":"p6"},{"t":"It has worn a series of colours since 1889: a reddish-brown at first, then ochre-yellow, then a chestnut-brown, and since 1968 a custom shade known as Eiffel Tower Brown.","pid":"p6"}]},{"id":4,"domain":"en.wikipedia.org","site":"Wikipedia","title":"Gustave Eiffel","url":"https://en.wikipedia.org/wiki/Gustave_Eiffel","chars":24000,"kept":2965,"via":"direct","lap":0,"clipped":false,"lines":[{"t":"He is best known for the Eiffel Tower, designed by his company and built for the 1889 Universal Exposition in Paris, and his contribution to building the Statue of Liberty (Liberty Enlightening the World) in New York.","pid":"p7"},{"t":"Eiffel devised a structure consisting of a four legged pylon to support the copper sheeting which made up the body of the statue.","pid":"p7"},{"t":"The design was exhibited at the Exhibition of Decorative Arts in the autumn of 1884, and on 30 March 1885, Eiffel read a paper on the project to the Société des Ingénieurs Civils.","pid":"p7"},{"t":"A budget for the Exposition was passed and on 1 May Lockroy announced an alteration to the terms of the open competition which was being held for a centerpiece for the exposition, which effectively made the choice of Eiffel's design a foregone conclusion: all entries had to include a study for a 300-metre (980 ft) four-sided metal tower on the Champ de Mars.","pid":"p7"},{"t":"This gave ammunition to his critics, and lurid headlines including \"Eiffel Suicide!\"","pid":"p7"},{"t":"The main structural work was completed at the end of March 1889, and, on 31 March, Eiffel celebrated by leading a group of government officials, accompanied by representatives of the press, to the top of the tower.","pid":"p7"},{"t":"On 9 February 1893, Eiffel was found guilty on the charge of misuse of funds and was fined 20,000 francs and sentenced to two years in prison, although he was acquitted on appeal.","pid":"p7"}]},{"id":5,"domain":"toureiffel.paris","site":"Eiffel Tower","title":"From 300 to 330 meters : the story of the Tower’s height - The Eiffel Tower","url":"https://www.toureiffel.paris/en her.","pid":"p0"},{"t":"The traditionally small presidential staff was greatly expanded, with the Executive Office of the President being created in 1939, none of whom require Senate confirmation.","pid":"p0"},{"t":"His successors, Harry S. Truman and Dwight D. Eisenhower, each served two terms as the Cold War led the presidency to be viewed as the \"leader of the free world\", while John F. Kennedy was a youthful and popular leader who benefited from the rise of television in the 1960s.","pid":"p0"},{"t":"Article II, Section 3, Clause 2 requires the president to recommend such measures to Congress which the president deems \"necessary and expedient\".","pid":"p0"},{"t":"Since John Adams first did so in 1797, the president has called the full Congress to convene for a special session on 27 occasions.","pid":"p0"},{"t":"To manage the growing federal bureaucracy, presidents have gradually surrounded themselves with many layers of staff, who were eventually organized into the Executive Office of the President of the United States.","pid":"p0"},{"t":"Article II, Section 3, Clause 4 requires the president to \"receive Ambassadors\".","pid":"p0"},{"t":"In all, 45 individuals have served, or are serving, 47 presidencies as of the current 60th four-year term.","pid":"p3"},{"t":"After the end of Reconstruction, Grover Cleveland was the first Democratic president elected since before the war, running in three consecutive elections (1884, 1888, 1892) and winning twice.","pid":"p3"}]},{"id":1,"domain":"en.wikipedia.org","site":"Wikipedia","title":"List of United States presidential candidates","url":"https://en.wikipedia.org/wiki/List_of_United_States_presidential_candidates","chars":4114,"kept":455,"via":"direct","lap":0,"clipped":false,"lines":[{"t":"This article is a list of United States presidential candidates.","pid":"p1"},{"t":"Under these rules, the individual who received the most electoral votes would become president, and the individual who received the second most e
