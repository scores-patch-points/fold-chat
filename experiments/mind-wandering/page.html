<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mind-wandering — feed it a thought, watch it mull the universe of priors</title>
<style>
 :root { --bg:#0c0d10; --fg:#e8e6df; --dim:#8b8f98; --line:#23262d; --ok:#7fd1a8; --warn:#e6c168; --bad:#e07a6a; --accent:#8fb7e0; --pathos:#d9b8e8; }
 * { box-sizing:border-box; }
 body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
 header { position:sticky; top:0; background:linear-gradient(#0c0d10,#0c0d10f2); border-bottom:1px solid var(--line); padding:11px 16px; display:flex; gap:9px; align-items:center; flex-wrap:wrap; z-index:5; }
 h1 { font-size:13px; margin:0 10px 0 0; letter-spacing:.05em; color:var(--accent); font-weight:600; }
 h1 b { color:var(--pathos); font-weight:600; }
 input,select,button { background:#14161b; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font:inherit; }
 input#think { width:360px; } input[type=number]{ width:74px; }
 button { cursor:pointer; border-color:#2f3540; } button:hover { background:#1c2027; }
 button.primary { background:#1d2a38; border-color:#33506b; color:#cfe4f7; }
 .meta { color:var(--dim); font-size:12px; margin-left:auto; }
 main { display:grid; grid-template-columns: 320px 1fr; height:calc(100vh - 58px); }
 #feed { overflow:auto; border-right:1px solid var(--line); padding:8px 10px; }
 .step { padding:3px 0; border-bottom:1px solid #171a20; font-size:11.5px; display:flex; gap:6px; align-items:baseline; }
 .n { color:#4d525c; width:28px; text-align:right; flex:none; }
 .f { width:96px; flex:none; color:var(--accent); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
 .g { color:var(--fg); font-weight:600; flex:none; }
 .via { color:#5b6069; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
 #right { display:flex; flex-direction:column; overflow:hidden; }
 #out { flex:1; overflow:auto; padding:26px 34px; font-size:19px; line-height:1.9; white-space:pre-wrap; font-family:Georgia,"Times New Roman",serif; }
 #out .refrain { color:var(--pathos); font-style:italic; }
 #out .caret { color:var(--pathos); animation:blink 1s steps(2) infinite; }
 @keyframes blink { 50% { opacity:0; } }
 #foot { border-top:1px solid var(--line); padding:8px 16px; color:var(--dim); font-size:11.5px; display:flex; gap:16px; flex-wrap:wrap; }
 #foot .p { color:var(--pathos); } #foot .j { color:var(--ok); } #foot b { color:var(--fg); font-weight:600; }
</style></head>
<body>
<header>
  <h1>mind-wandering · <b>the concept universe</b></h1>
  <input id="think" value="homecoming and the guest at the door" placeholder="something to think about">
  <input id="steps" type="number" value="70" min="1" max="500">
  <select id="register"><option>attentive</option><option>elegiac</option><option>dread</option><option>tender</option><option>plain</option></select>
  <button id="go" class="primary">Mull</button>
  <button id="suggest">Suggest</button>
  <span class="meta" id="meta">Concepticon · 4,165 concepts · no model</span>
</header>
<main>
  <div id="feed"></div>
  <div id="right">
    <div id="out"></div>
    <div id="foot"></div>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
let es = null;
const feed = $("#feed"), out = $("#out"), foot = $("#foot");
const esc = (s) => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
$("#suggest").onclick = async () => {
  const r = await fetch("/suggest"); const j = await r.json();
  $("#think").value = j.words[Math.floor(Math.random()*j.words.length)].toLowerCase();
};
function start() {
  if (es) es.close();
  feed.innerHTML = ""; out.textContent = ""; foot.textContent = "";
  const think = encodeURIComponent($("#think").value.trim() || "home");
  const steps = $("#steps").value, register = $("#register").value;
  es = new EventSource(`/stream?think=${think}&steps=${steps}&register=${register}`);
  es.addEventListener("hello", (e) => {
    const d = JSON.parse(e.data);
    $("#meta").textContent = `thinking about “${d.think}” · seeds: ${d.seeds.join(", ")}`;
    foot.innerHTML = d.archon ? `<span class="p">Penelope routed</span> <b>${esc(d.archon.giver)}</b> — ${esc(d.archon.work)}` : "";
  });
  es.addEventListener("step", (e) => {
    const d = JSON.parse(e.data);
    const row = document.createElement("div"); row.className = "step";
    row.innerHTML = `<span class="n">${String(d.n).padStart(4,"0")}</span>` +
      `<span class="f">${esc(d.field || "")}</span>` +
      `<span class="g">${esc(d.concept.gloss)}</span>` +
      `<span class="via">${esc(d.next ? "→ " + (d.next.via || "") + " " + (d.next.gloss || "") : "")}</span>`;
    feed.appendChild(row); feed.scrollTop = feed.scrollHeight;
    out.textContent = d.out || "";
    const c = document.createElement("span"); c.className = "caret"; c.textContent = "▌"; out.appendChild(c);
    out.scrollTop = out.scrollHeight;
  });
  es.addEventListener("pathos", (e) => {
    const d = JSON.parse(e.data);
    foot.innerHTML =
      `${d.archon ? `<span class="p">Penelope</span> <b>${esc(d.archon.giver)}</b> — ${esc(d.archon.work)}` : ""}` +
      ` · <span class="j">universe</span> <b>${d.universe.concepts.toLocaleString()}</b> concepts / ${d.universe.relations} relations` +
      ` · <span class="j">visited</span> <b>${d.fields.length}</b> field(s)` +
      ` · <span class="p">refrains</span> <b>${d.refrains.length}</b> · no model`;
  });
  es.addEventListener("done", (e) => {
    const d = JSON.parse(e.data);
    $("#meta").textContent = `mulled · ${d.steps} concept(s) · ${d.ms}ms · no model`;
    es.close();
  });
  es.onerror = () => { $("#meta").textContent = "stream closed — press Mull to go again"; if (es) es.close(); };
}
$("#go").onclick = start;
setTimeout(start, 150);
</script>
</body></html>
